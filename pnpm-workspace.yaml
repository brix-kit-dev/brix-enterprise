# Brix Enterprise Monorepo Workspace Configuration
#
# PROPRIETARY AND CONFIDENTIAL
# This file defines the workspace packages for the enterprise monorepo.
#
# CRITICAL DEPENDENCY RULE:
# - Enterprise packages use version numbers (e.g., @brix-sdk/runtime-core@3.1.0)
#   to depend on Core packages
# - NEVER use workspace:* for cross-repo dependencies
# - workspace:* is ONLY for internal enterprise package references
#
# Architecture Layer: Build Infrastructure
# License: Proprietary
# Version: 3.1.0
# ============================================================================

packages:
  # ==================== Enterprise Packages ====================
  # Enterprise Host - Production capability orchestration
  - 'packages/@brix/enterprise-host'
  - 'packages/@brix/enterprise-host/*'
  
  # Enterprise Solutions - Business application plugins
  - 'packages/@brix/enterprise-solutions'
  - 'packages/@brix/enterprise-solutions/*'
  - 'packages/@brix/enterprise-solutions/*/*'  # Include nested packages like app-booking/booking-ui-web

  # ==================== Examples ====================
  - 'examples/*'

  # ==================== End-to-End Tests (Phase 3 / C-5) ====================
  # Super-admin Playwright suite — runs against a real backend stack
  # (Postgres + Redis + Spring Boot host) on main / nightly only.
  - 'e2e-tests/*'

# ============================================================================
# Catalog (pnpm 8.6+) - Shared dependency versions
# ============================================================================
catalog:
  # Build Tools
  typescript: ^5.3.0
  tsup: ^8.0.1
  vite: ^8.0.14
  vitest: ^1.2.0
  
  # Code Quality
  eslint: ^8.56.0
  prettier: ^3.2.0
  
  # React Ecosystem
  react: ^18.3.0
  react-dom: ^18.3.0
  
  # Release Management
  "@changesets/cli": ^2.27.1
