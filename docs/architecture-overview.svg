<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="756" viewBox="0 0 1320 756" role="img" aria-labelledby="overview-title overview-desc">
  <!-- Hand-drawn navigation aid, not a specification. docs/README.md says when to update it. -->
  <title id="overview-title">Brix 总体架构图</title>
  <desc id="overview-desc">Brix 总体架构图。业务插件在中间，运行壳包在外面：请求由 L2B 的 HTTP Dispatcher 送进插件；插件只能穿过 L2A 契约层往外走，经 L2B 代理和 L2C 适配器到达基础设施；插件之间不能直连，只能走 Query、Command、Event。</desc>
