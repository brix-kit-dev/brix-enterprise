# ============================================================================
# Dependency Vulnerability Scanning Workflow
# ============================================================================
#
# Phase 4.5 — CI dependency vulnerability scanning (enterprise repo).
#
# 1. **OWASP Dependency-Check** — scans Maven dependencies for known CVEs.
#    Fails on CVSS >= 7.0.
# 2. **GitHub Dependency Review** — blocks PRs introducing vulnerable deps.
#
# @see v3.0.9 Architecture Review — Phase 4: Performance & Quality
# ============================================================================

name: Dependency Vulnerability Scan

on:
  push:
    branches: [main, develop]
    paths:
      - '**/pom.xml'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - '**/package.json'
  pull_request:
    branches: [main, develop]
  schedule:
    # Run weekly on Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: dependency-scan-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Job 1: OWASP Dependency-Check for Maven (Java backend)
  # ============================================================================
  owasp-maven:
    name: OWASP Dependency-Check (Maven)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run OWASP Dependency-Check
        run: |
          mvn org.owasp:dependency-check-maven:check \
            -DfailBuildOnCVSS=7 \
            -DsuppressionFiles=.github/owasp-suppressions.xml \
            -Dformats="HTML,JSON" \
            -DnvdApiKey=${{ secrets.NVD_API_KEY }} \
            --batch-mode --no-transfer-progress
        continue-on-error: false

      - name: Upload OWASP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-dependency-check-report
          path: '**/target/dependency-check-report.*'
          retention-days: 30

  # ============================================================================
  # Job 2: GitHub Dependency Review (PR only)
  # ============================================================================
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0, AGPL-3.0
