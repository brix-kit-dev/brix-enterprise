# ============================================================================
# Shinwa Platform - pnpm Workspace 配置
# ============================================================================
#
# 【说明】
# shinwa-platform 是 Shinwa 平台的私有商业模块仓库。
# 包含不开源的登录基座、品牌定制等模块。
#
# 【模块命名规范】
# - shinwa-platform-xxx-web：Web 端私有模块
# - shinwa-platform-xxx-mobile：移动端私有模块
#
# ============================================================================

packages:
  # ═══════ 登录基座模块（私有，不开源） ═══════
  - 'shinwa-platform-shell-web'      # Web 登录基座
  # - 'shinwa-platform-shell-mobile'   # Mobile 登录基座（暂时禁用，需要配置 platform-auth-mobile 依赖）
