# ============================================================================
# Architecture Guard CI - Comprehensive Architecture Validation
# ============================================================================
#
# This CI pipeline enforces architectural rules from the Architecture Review
# Checklist (附录C). All 9 CI-automatable checks are implemented here.
#
# ============================================================================
# 附录C 可 CI 化检查项对照表（9 checks total）
# ============================================================================
#
# | ID        | Check                              | Implementation      |
# |-----------|------------------------------------|--------------------|
# | R1.1-R1.4 | Plugin core no infra dependency    | ArchUnit tests     |
# | R6.1-R6.3 | Java Host ultra-thin               | ArchUnit + LOC     |
# | R6.4      | TS Host file/line count threshold  | find + wc -l       |
# | R7.1-R7.2 | Frontend layer import restrictions | ESLint rules       |
# | BP3/OS9   | Build artifacts not in Git         | git ls-files       |
# | BP4/OS1   | Secret leak detection              | gitleaks           |
# | RM1       | No .class files in source dirs     | find check         |
# | FS5       | No localStorage in plugin layer    | ESLint rules       |
#
# 【Ultra-Thin Host Principle】
# - Host module LOC ≤ 500 lines (excluding comments/blanks)
# - No @Service/@Repository/@Controller annotations (health checks exempt)
# - No implements XxxCapability (capability impl belongs in infra-adapters)
# ============================================================================

name: Architecture Guard

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  # ========================================
  # 🔐 BP4/OS1: Secret Leak Detection
  # ========================================
  secret-scan:
    name: Secret Leak Scan (BP4/OS1)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
      
      - name: Additional Secret Pattern Check
        run: |
          echo "🔍 Checking for additional secret patterns..."
          
          found=false
          
          # Check for private keys
          if find . -name "*.pem" -type f ! -path "./.git/*" ! -name "*.example.pem" | grep -q .; then
            echo "❌ Found .pem files (potential private keys):"
            find . -name "*.pem" -type f ! -path "./.git/*" ! -name "*.example.pem"
            found=true
          fi
          
          # Check for PKCS12 keystores
          if find . -name "*.p12" -name "*.pfx" -type f ! -path "./.git/*" | grep -q .; then
            echo "❌ Found .p12/.pfx files (potential keystores):"
            find . -name "*.p12" -name "*.pfx" -type f ! -path "./.git/*"
            found=true
          fi
          
          # Check for client secrets
          if find . -name "*client_secret*" -type f ! -path "./.git/*" | grep -q .; then
            echo "❌ Found client_secret files:"
            find . -name "*client_secret*" -type f ! -path "./.git/*"
            found=true
          fi
          
          # Check for .env with real values (not placeholders)
          for env_file in $(find . -name ".env" -type f ! -path "./.git/*" 2>/dev/null); do
            if grep -qvE "(your-|changeme|placeholder|TODO|FIXME|xxx|demo)" "$env_file" 2>/dev/null; then
              # Has content that doesn't look like placeholders
              if grep -E "^[A-Z_]+=.+" "$env_file" | grep -qvE "(your-|changeme|placeholder|TODO|xxx)" 2>/dev/null; then
                echo "⚠️  Found .env with potential real values: $env_file"
              fi
            fi
          done
          
          if [ "$found" = true ]; then
            echo ""
            echo "⚠️  Secret files detected! These should be in .gitignore and not committed."
            echo "    Please remove secrets and rotate any exposed credentials."
            exit 1
          else
            echo "✅ No additional secret patterns found"
          fi

  # ========================================
  # 📦 BP3/OS9: Build Artifacts Check
  # ========================================
  build-artifacts-check:
    name: Build Artifacts Not in Git (BP3/OS9)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Check for committed build artifacts
        run: |
          echo "🔍 Checking for committed build artifacts..."
          
          found=false
          
          # Check for dist/ directories in git
          DIST_FILES=$(git ls-files | grep -E "^dist/|/dist/" || true)
          if [ -n "$DIST_FILES" ]; then
            echo "❌ Found dist/ files committed to Git:"
            echo "$DIST_FILES" | head -20
            [ $(echo "$DIST_FILES" | wc -l) -gt 20 ] && echo "... and more"
            found=true
          fi
          
          # Check for target/ directories in git
          TARGET_FILES=$(git ls-files | grep -E "^target/|/target/" || true)
          if [ -n "$TARGET_FILES" ]; then
            echo "❌ Found target/ files committed to Git:"
            echo "$TARGET_FILES" | head -20
            [ $(echo "$TARGET_FILES" | wc -l) -gt 20 ] && echo "... and more"
            found=true
          fi
          
          # Check for node_modules in git
          NODE_MODULES=$(git ls-files | grep -E "^node_modules/|/node_modules/" || true)
          if [ -n "$NODE_MODULES" ]; then
            echo "❌ Found node_modules/ files committed to Git:"
            echo "$NODE_MODULES" | head -10
            found=true
          fi
          
          # Check for .jar files (except test fixtures)
          JAR_FILES=$(git ls-files | grep -E "\.jar$" | grep -v "test-fixtures" || true)
          if [ -n "$JAR_FILES" ]; then
            echo "❌ Found .jar files committed to Git:"
            echo "$JAR_FILES"
            found=true
          fi
          
          if [ "$found" = true ]; then
            echo ""
            echo "⚠️  Build artifacts should be in .gitignore, not committed to Git"
            exit 1
          else
            echo "✅ No build artifacts found in Git"
          fi

  # ========================================
  # ☕ RM1: No .class Files in Source
  # ========================================
  class-files-check:
    name: No .class in Source (RM1)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Check for .class files in source directories
        run: |
          echo "🔍 Checking for .class files in source directories..."
          
          # Find .class files in src/ directories (excluding target/)
          CLASS_FILES=$(find . -path "*/src/*" -name "*.class" -type f ! -path "*/target/*" 2>/dev/null || true)
          
          if [ -n "$CLASS_FILES" ]; then
            echo "❌ Found .class files in source directories:"
            echo "$CLASS_FILES"
            echo ""
            echo "⚠️  .class files should not exist in src/ directories"
            echo "    These are likely accidentally committed or exported class files"
            exit 1
          else
            echo "✅ No .class files found in source directories"
          fi
  # ========================================
  # Java 架构测试
  # ========================================
  java-architecture:
    name: Java Architecture Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with: 
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      
      - name: Run Architecture Tests
        run: mvn test -Dtest="*ArchitectureTest" --fail-at-end -B
      
      - name: Check Host Thinness
        run: |
          echo "🔍 检查 Host 模块代码行数..."
          
          failed=false
          
          for dir in host-shell-standalone host-shell-embedded; do
            if [ -d "$dir" ]; then
              # 统计 Java 源代码行数（排除空行和注释）
              loc=$(find "$dir/src/main/java" -name "*.java" -exec cat {} \; 2>/dev/null | \
                    grep -v '^\s*$' | \
                    grep -v '^\s*//' | \
                    grep -v '^\s*\*' | \
                    wc -l || echo 0)
              
              echo "📊 $dir: $loc 行代码"
              
              if [ "$loc" -gt 500 ]; then
                echo "❌ $dir 代码行数 $loc > 500，违反极薄 Host 原则"
                failed=true
              else
                echo "✅ $dir 符合极薄 Host 原则"
              fi
            fi
          done
          
          if [ "$failed" = true ]; then
            exit 1
          fi
      
      - name: Check Forbidden Annotations in Host
        run: |
          echo "🔍 检查 Host 模块禁止的注解..."
          
          # 检查 @Service, @Repository, @Controller（健康检查除外）
          forbidden_patterns=(
            "@Service"
            "@Repository"
            "@Controller[^A]"  # 排除 @ControllerAdvice
          )
          
          found_violations=false
          
          for dir in host-shell-standalone host-shell-embedded; do
            if [ -d "$dir/src/main/java" ]; then
              for pattern in "${forbidden_patterns[@]}"; do
                matches=$(grep -r -l "$pattern" "$dir/src/main/java" 2>/dev/null || true)
                if [ -n "$matches" ]; then
                  echo "❌ 在 $dir 中发现禁止的注解 $pattern:"
                  echo "$matches"
                  found_violations=true
                fi
              done
            fi
          done
          
          if [ "$found_violations" = true ]; then
            echo "⚠️  Host 层不应包含 @Service/@Repository/@Controller 注解"
            echo "    这些实现应该在 infra-adapters 或 platform-commons 中"
            exit 1
          else
            echo "✅ Host 模块未发现禁止的注解"
          fi
      
      - name: Check Capability Implementation in Host
        run: |
          echo "🔍 检查 Host 模块是否包含能力实现..."
          
          found_violations=false
          
          for dir in host-shell-standalone host-shell-embedded; do
            if [ -d "$dir/src/main/java" ]; then
              # 检查是否有 implements XxxCapability
              matches=$(grep -r -l "implements.*Capability" "$dir/src/main/java" 2>/dev/null || true)
              if [ -n "$matches" ]; then
                echo "❌ 在 $dir 中发现能力实现代码:"
                echo "$matches"
                found_violations=true
              fi
            fi
          done
          
          if [ "$found_violations" = true ]; then
            echo "⚠️  Host 层不应包含能力实现（implements XxxCapability）"
            echo "    能力实现应该在 infra-adapters 中"
            exit 1
          else
            echo "✅ Host 模块未发现能力实现代码"
          fi

  # ========================================
  # TypeScript 架构检查（如有前端代码）
  # ========================================
  ts-architecture:
    name: TypeScript Architecture Lint
    runs-on: ubuntu-latest
    # 仅当存在 package.json 时运行
    if: hashFiles('package.json') != ''
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Run ESLint
        run: pnpm lint

  # ========================================
  # 🌐 R6.4: TS Host Ultra-Thin Check
  # ========================================
  ts-host-thinness:
    name: TS Host Ultra-Thin (R6.4)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Check TS Host file count and LOC
        run: |
          echo "🔍 Checking TypeScript Host file count and LOC..."
          
          # Thresholds for ultra-thin TS Host
          MAX_FILES=30
          MAX_LOC=2000
          
          failed=false
          
          for dir in host-shell-standalone-web; do
            if [ -d "$dir/src" ]; then
              # Count TypeScript/TSX files (excluding tests and type definitions)
              file_count=$(find "$dir/src" -type f \( -name "*.ts" -o -name "*.tsx" \) \
                ! -name "*.d.ts" ! -name "*.test.ts" ! -name "*.test.tsx" ! -name "*.spec.ts" ! -name "*.spec.tsx" \
                | wc -l)
              
              # Count lines of code (excluding empty lines and comments)
              loc=$(find "$dir/src" -type f \( -name "*.ts" -o -name "*.tsx" \) \
                ! -name "*.d.ts" ! -name "*.test.ts" ! -name "*.test.tsx" \
                -exec cat {} \; 2>/dev/null | \
                grep -v '^\s*$' | \
                grep -v '^\s*//' | \
                grep -v '^\s*\*' | \
                grep -v '^\s*/\*' | \
                wc -l || echo 0)
              
              echo "📊 $dir:"
              echo "   Files: $file_count (threshold: $MAX_FILES)"
              echo "   LOC:   $loc (threshold: $MAX_LOC)"
              
              if [ "$file_count" -gt "$MAX_FILES" ]; then
                echo "❌ $dir has $file_count files > $MAX_FILES threshold"
                failed=true
              fi
              
              if [ "$loc" -gt "$MAX_LOC" ]; then
                echo "❌ $dir has $loc LOC > $MAX_LOC threshold"
                failed=true
              fi
              
              if [ "$failed" = false ]; then
                echo "✅ $dir meets ultra-thin Host requirements"
              fi
            fi
          done
          
          if [ "$failed" = true ]; then
            echo ""
            echo "⚠️  TS Host violates ultra-thin principle"
            echo "    Move runtime logic to shinwa-platform-shell-web or plugins"
            exit 1
          fi
      
      - name: Check for UI components in Host
        run: |
          echo "🔍 Checking for UI components in TS Host..."
          
          for dir in host-shell-standalone-web; do
            if [ -d "$dir/src" ]; then
              # Count React components (files with JSX/TSX that export components)
              components=$(grep -rl "export.*function\|export.*const.*=.*(" "$dir/src" 2>/dev/null | \
                xargs -I{} grep -l "return.*<" {} 2>/dev/null | wc -l || echo 0)
              
              echo "📊 $dir: $components UI components detected"
              
              if [ "$components" -gt 5 ]; then
                echo "⚠️  Found $components UI components (>5) in Host layer"
                echo "    UI components should be in shinwa-platform-shell-web, not Host"
                # Warning only, not failing for now
              else
                echo "✅ UI component count acceptable"
              fi
            fi
          done

  # ========================================
  # 📋 Architecture Guard Summary
  # ========================================
  guard-summary:
    name: Architecture Guard Summary
    runs-on: ubuntu-latest
    needs: [secret-scan, build-artifacts-check, class-files-check, java-architecture, ts-host-thinness]
    if: always()
    steps:
      - name: Check all jobs
        run: |
          echo "============================================"
          echo "Architecture Guard - 附录C 9 项检查结果汇总"
          echo "============================================"
          echo ""
          echo "| Check ID   | Job                     | Status |"
          echo "|------------|-------------------------|--------|"
          echo "| BP4/OS1    | Secret Leak Scan        | ${{ needs.secret-scan.result }} |"
          echo "| BP3/OS9    | Build Artifacts Check   | ${{ needs.build-artifacts-check.result }} |"
          echo "| RM1        | No .class in Source     | ${{ needs.class-files-check.result }} |"
          echo "| R6.1-R6.3  | Java Host Ultra-Thin    | ${{ needs.java-architecture.result }} |"
          echo "| R6.4       | TS Host Ultra-Thin      | ${{ needs.ts-host-thinness.result }} |"
          echo "| R1.1-R1.4  | (ArchUnit tests)        | included in java-architecture |"
          echo "| R7.1-R7.2  | (ESLint rules)          | included in ts-architecture |"
          echo "| FS5        | (ESLint no-localStorage)| included in ts-architecture |"
          echo ""
          
          # Check if any job failed
          if [ "${{ needs.secret-scan.result }}" = "failure" ] || \
             [ "${{ needs.build-artifacts-check.result }}" = "failure" ] || \
             [ "${{ needs.class-files-check.result }}" = "failure" ] || \
             [ "${{ needs.java-architecture.result }}" = "failure" ] || \
             [ "${{ needs.ts-host-thinness.result }}" = "failure" ]; then
            echo "❌ Some architecture checks failed. Please fix before merging."
            exit 1
          else
            echo "✅ All architecture checks passed!"
          fi
