# ============================================================
# Brix Enterprise - 嵌入模式 Docker Compose
# ============================================================
# 
# 用途：轻量级嵌入模式部署，最小化基础设施依赖
# 模块：host-shell-embedded
#
# 启动命令：
#   docker compose up -d
#
# 停止命令：
#   docker compose down
#
# 查看日志：
#   docker compose logs -f host-shell
#
# ============================================================

services:
  # ============================================================
  # 运行壳（嵌入模式）
  # ============================================================
  host-shell:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: brix-host-shell-embedded
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=embedded
      - BRIX_SHELL_EMBEDDED_PARENT_CALLBACK_URL=http://host.docker.internal:8081/webhook
    networks:
      - brix-embedded-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  brix-embedded-network:
    driver: bridge
