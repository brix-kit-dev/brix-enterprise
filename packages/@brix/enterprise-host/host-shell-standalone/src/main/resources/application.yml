# ============================================================
# Shinwa Platform - 产品模式运行壳配置
# ============================================================
# 
# host-shell-standalone：产品模式运行壳
# 
# 适用场景：
#   - Shinwa Platform 标准产品部署
#   - 完整功能需求场景
#   - 具备完整基础设施（Kafka/Redis/OTel）的环境
#
# ============================================================

spring:
  application:
    name: shinwa-platform
  profiles:
    active: standalone
    
server:
  port: 8081

---
# ============================================================
# standalone profile - 完整产品模式
# ============================================================
spring:
  config:
    activate:
      on-profile: standalone

  # ==================== 数据库配置 ====================
  # 🔴 安全警告：密码必须通过环境变量提供，禁止使用默认值
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:shinwa_platform}
    username: ${DB_USERNAME:shinwa}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # ==================== Flyway 数据库迁移 ====================
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: '0'
    validate-on-migrate: true
    out-of-order: false

  # ==================== Kafka 配置 ====================
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
    consumer:
      group-id: shinwa-platform
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

  # ==================== Redis 配置 ====================
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5

# ==================== 运行壳配置 ====================
brix:
  # MinIO 在测试环境下禁用（无 MinIO 服务）
  infra:
    minio:
      enabled: false
    # OpenTelemetry 在 Docker 环境下禁用（使用 Fallback ObservabilityCapability）
    otel:
      enabled: false
  shell:
    standalone:
      enabled: true
      
      # 模块标识
      module-id: ${BRIX_MODULE_ID:shinwa-platform}
      
      # 租户标识
      tenant-id: ${BRIX_TENANT_ID:default}
      
      # ========== 能力配置（声明式能力组装） ==========
      capabilities:
        # 必需能力（启动时验证必须存在）
        required:
          - io.runtime.sdk.capability.EventBusCapability
          - io.runtime.sdk.capability.StateStoreCapability
          - io.runtime.sdk.capability.AuthContextCapability
          - io.runtime.sdk.capability.ObservabilityCapability
          - io.runtime.sdk.capability.ConfigStoreCapability
          - io.runtime.sdk.capability.LifecycleCapability
        # 可选能力
        optional:
          - io.runtime.sdk.capability.SchedulingCapability
          - io.runtime.sdk.capability.LockCapability
          - io.runtime.sdk.capability.ResilienceCapability
        # 禁用能力
        disabled: []
        # 自动发现开关
        auto-discovery: true
        # 启动时验证
        validate-on-startup: true
      
      # ========== 事件总线配置 ==========
      event-bus:
        type: kafka
        outbox-enabled: true
      
      # ========== 状态存储配置 ==========
      state-store:
        type: redis
        key-prefix: "shinwa:"
      
      # ========== 定时任务配置 ==========
      scheduling:
        enabled: true
        pool-size: 5
      
      # ========== 分布式锁配置 ==========
      lock:
        enabled: true
        type: redis
      
      # ========== 可观测性配置 ==========
      observability:
        type: otel
        service-name: shinwa-platform
        sampling-ratio: 1.0

# ==================== Actuator 配置 ====================

# ==================== Identity JWT 配置 ====================
identity:
  jwt:
    private-key-path: classpath:keys/private.pem
    issuer: shinwa-auth-center
    audience: shinwa-platform-api
    expiration: ${JWT_EXPIRATION:3600}

# ==================== Actuator 配置 ====================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    redis:
      enabled: true
    db:
      enabled: true

# ==================== OpenTelemetry 配置 ====================
otel:
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
  service:
    name: shinwa-platform
  traces:
    exporter: otlp
