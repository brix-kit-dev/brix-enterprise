# ============================================================
# Brix Enterprise - 产品模式运行壳配置
# ============================================================
# 
# host-shell-standalone：产品模式运行壳
# 
# 适用场景：
#   - Brix Enterprise 标准产品部署
#   - 完整功能需求场景
#   - 具备完整基础设施（Kafka/Redis/OTel）的环境
#
# ============================================================

spring:
  application:
    name: enterprise-shell
  profiles:
    active: standalone
    
server:
  port: 8081

---
# ============================================================
# standalone profile - 完整产品模式
# ============================================================
spring:
  config:
    activate:
      on-profile: standalone

  # ==================== 数据库配置 ====================
  # 🔴 安全警告：密码必须通过环境变量提供，禁止使用默认值
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:brix_platform}
    username: ${DB_USERNAME:brix}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      # Schema ownership (transitional, blueprint-aligned):
      #   1. Flyway runs FIRST (per-module migrations in infra-adapter-database)
      #      and is the source of truth for all explicitly modelled tables
      #      (platform-auth, platform-tenant, app-* with V100+ scripts).
      #   2. Hibernate runs AFTER Flyway (enforced by
      #      EntityManagerFactoryDependsOnPostProcessor in
      #      FlywayModuleMigrationAutoConfiguration). In `update` mode it only
      #      ADDS missing columns/tables for legacy JPA entities that have not
      #      yet been migrated to Flyway DDL (e.g. contract_party,
      #      contract_sign_record, template_version). Hibernate never drops or
      #      mutates Flyway-owned columns.
      # The long-term target is `validate` once every entity has a Flyway script.
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # ==================== Flyway 数据库迁移 ====================
  # Multi-module migration is now managed by infra-adapter-database (Layer 2C).
  # Module list is configured via brix.infra.database.migration.modules below.
  flyway:
    enabled: false  # Disable default Flyway — per-module migration handled by infra-adapter-database

  # ==================== Kafka 配置 ====================
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
    consumer:
      group-id: enterprise-shell
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

  # ==================== Redis 配置 ====================
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5

# ==================== 运行壳配置 ====================
brix:
  capability:
    enabled: true
    module-id: ${BRIX_MODULE_ID:enterprise-shell}
    tenant-id: ${BRIX_TENANT_ID:default}
    auto-discovery: true
    validate-on-startup: true
    required:
      - io.runtime.sdk.capability.EventBusCapability
      - io.runtime.sdk.capability.StateStoreCapability
      - io.runtime.sdk.capability.AuthCapability
      - io.runtime.sdk.capability.ObservabilityCapability
      - io.runtime.sdk.capability.ConfigStoreCapability
      - io.brix.platform.tenant.internal.TenantAdministration
      - io.brix.platform.tenant.internal.PlatformBootstrapAdministration
      - io.brix.platform.tenant.internal.PlatformIdentityAdministration
  runtime-shell:
    enabled: true
    runtime-version: ${BRIX_RUNTIME_SHELL_VERSION:3.2.0}
    host-mode: STANDALONE
    fatal-exit-code: ${BRIX_RUNTIME_SHELL_FATAL_EXIT_CODE:70}
    endpoint-deadline-millis: ${BRIX_RUNTIME_ENDPOINT_DEADLINE_MILLIS:30000}
    required-operational-modules:
      - platform-admin
    required-plugins:
      - platform-tenant
      - app-booking
  outbox:
    relay:
      enabled: ${BRIX_OUTBOX_RELAY_ENABLED:true}
      owner: ${BRIX_OUTBOX_RELAY_OWNER:enterprise-shell}
      batch-size: ${BRIX_OUTBOX_RELAY_BATCH_SIZE:25}
      max-attempts: ${BRIX_OUTBOX_RELAY_MAX_ATTEMPTS:6}
      lease-duration: ${BRIX_OUTBOX_RELAY_LEASE_DURATION:30s}
      retry-backoff-base: ${BRIX_OUTBOX_RELAY_RETRY_BACKOFF_BASE:5s}
      retry-jitter-max: ${BRIX_OUTBOX_RELAY_RETRY_JITTER_MAX:5s}
      poll-delay: ${BRIX_OUTBOX_RELAY_POLL_DELAY:1s}
      persistence:
        enabled: ${BRIX_OUTBOX_RELAY_PERSISTENCE_ENABLED:true}
        table-name: ${BRIX_OUTBOX_RELAY_PERSISTENCE_TABLE:platform_tenant_outbox}
  # Fallback Adapter — provides dev/test stand-ins for required capabilities that
  # have no production-grade Adapter wired yet (auth, observability, etc.).
  # Triple-gated by infra-adapter-fallback (Profile != production AND explicit
  # opt-in AND @ConditionalOnMissingBean), so enabling here is safe for dev only.
  # Production deployments MUST replace these with real Adapters
  # (e.g. infra-adapter-simple DelegatedAuthContextCapability backed by an OAuth
  # introspection endpoint) per Blueprint v3.0.x §3 Capability Contract.
  fallback:
    auth:
      enabled: ${BRIX_FALLBACK_AUTH_ENABLED:true}
  # MinIO Adapter — provides FileStorageCapability (required by brix-app-storage plugin
  # per its plugin-manifest.json). Connection params are environment-driven so the same
  # JAR runs locally / Docker / production without code change. Set BRIX_INFRA_MINIO_ENABLED=false
  # only when intentionally disabling the storage plugin in a slimmed deployment.
  infra:
    kafka:
      enabled: ${BRIX_INFRA_KAFKA_ENABLED:true}
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
      topic-prefix: ${BRIX_INFRA_KAFKA_TOPIC_PREFIX:}
      outbox:
        publish-timeout-ms: ${BRIX_INFRA_KAFKA_OUTBOX_PUBLISH_TIMEOUT_MS:30000}
    minio:
      enabled: ${BRIX_INFRA_MINIO_ENABLED:true}
      endpoint: ${BRIX_INFRA_MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${BRIX_INFRA_MINIO_ACCESS_KEY:minioadmin}
      secret-key: ${BRIX_INFRA_MINIO_SECRET_KEY:}
      bucket-name: ${BRIX_INFRA_MINIO_BUCKET_NAME:brix-storage}
    # OpenTelemetry 在 Docker 环境下禁用（使用 Fallback ObservabilityCapability）
    otel:
      enabled: false
    # ==================== Multi-module Flyway Migration (Layer 2C) ====================
    # Configured here in YAML — no Java code in Host layer. The migration engine resides
    # in infra-adapter-database, respecting the Ultra-Thin Host principle (Constraint 6).
    database:
      migration:
        enabled: true
        modules:
          # Platform foundation (must run first — referenced by app-* migrations)
          - platform-auth        # creates auth_user / auth_role / auth_permission (referenced by app-identity V100)
          - platform-tenant      # creates sys_tenant / sys_identity / sys_tenant_member etc.
          # Application modules
          - app-identity
          - app-products
          - app-partners
          - app-messenger
          - app-carousel
          - app-case
          - app-contracts
          - app-storage
          - app-intake
          - app-compliance
          - app-tenant
    email:
      smtp:
        enabled: ${BRIX_INFRA_EMAIL_SMTP_ENABLED:true}
        from: ${BRIX_INFRA_EMAIL_SMTP_FROM:}
        tls-enabled: ${BRIX_INFRA_EMAIL_SMTP_TLS_ENABLED:true}
        certificate-hostname-validation: ${BRIX_INFRA_EMAIL_SMTP_CERTIFICATE_HOSTNAME_VALIDATION:true}
  # ==================== Platform Admin Setup Links ====================
  # Host only supplies externalized delivery metadata. The setup token is created
  # by the Data Owner and delivered through NotificationCapability.
  platform:
    notification:
      enabled: ${BRIX_PLATFORM_NOTIFICATION_ENABLED:true}
      default-locale: ${BRIX_PLATFORM_NOTIFICATION_DEFAULT_LOCALE:en-US}

    mfa:
      issuer: ${BRIX_PLATFORM_MFA_ISSUER:Brix}
      encryption-key: ${BRIX_PLATFORM_MFA_ENCRYPTION_KEY:}

    admin:
      setup:
        base-url: ${BRIX_PLATFORM_ADMIN_SETUP_BASE_URL:}
        mail-from: ${BRIX_PLATFORM_ADMIN_SETUP_MAIL_FROM:}
        token-ttl-seconds: ${BRIX_PLATFORM_ADMIN_SETUP_TOKEN_TTL_SECONDS:86400}
        return-url-for-dev-only: ${BRIX_PLATFORM_ADMIN_SETUP_RETURN_URL_FOR_DEV_ONLY:false}
        logging-notification-enabled: ${BRIX_PLATFORM_ADMIN_SETUP_LOGGING_NOTIFICATION_ENABLED:false}

    # ==================== Super-Admin Bootstrap ====================
    # v2.0 bootstrap creates only a passwordless BOOTSTRAP anchor in
    # IdentityStatus.PENDING_SETUP. It never seeds a formal admin password.
    # The setup code opens a short-lived Bootstrap Setup session, then
    # /api/platform/bootstrap/create-first-admin issues a setup link for the
    # first formal PLATFORM_SUPER_ADMIN.
    bootstrap:
      super-admin:
        enabled: ${BRIX_BOOTSTRAP_SUPER_ADMIN_ENABLED:true}
        email: ${BRIX_BOOTSTRAP_SUPER_ADMIN_EMAIL:}
        username: ${BRIX_BOOTSTRAP_SUPER_ADMIN_USERNAME:Super Admin}
        setup-code: ${BRIX_BOOTSTRAP_SUPER_ADMIN_SETUP_CODE:}
        setup-base-url: ${BRIX_PLATFORM_ADMIN_SETUP_BASE_URL:}
        setup-code-ttl-seconds: ${BRIX_BOOTSTRAP_SUPER_ADMIN_SETUP_CODE_TTL_SECONDS:900}
        bootstrap-session-ttl-seconds: ${BRIX_BOOTSTRAP_SUPER_ADMIN_SESSION_TTL_SECONDS:300}
  shell:
    standalone:
      enabled: true
      
      # 模块标识
      module-id: ${BRIX_MODULE_ID:enterprise-shell}
      
      # 租户标识
      tenant-id: ${BRIX_TENANT_ID:default}
      
      # ========== 能力配置（声明式能力组装） ==========
      capabilities:
        # 必需能力（启动时验证必须存在）
        required:
          - io.runtime.sdk.capability.EventBusCapability
          - io.runtime.sdk.capability.StateStoreCapability
          - io.runtime.sdk.capability.AuthCapability
          - io.runtime.sdk.capability.ObservabilityCapability
          - io.runtime.sdk.capability.ConfigStoreCapability
          - io.runtime.sdk.capability.LifecycleCapability
        # 可选能力
        optional:
          - io.runtime.sdk.capability.SchedulingCapability
          - io.runtime.sdk.capability.LockCapability
          - io.runtime.sdk.capability.ResilienceCapability
        # 禁用能力
        disabled: []
        # 自动发现开关
        auto-discovery: true
        # 启动时验证
        validate-on-startup: true
      
      # ========== 事件总线配置 ==========
      event-bus:
        type: kafka
        outbox-enabled: true
      
      # ========== 状态存储配置 ==========
      state-store:
        type: redis
        key-prefix: "brix:"
      
      # ========== 定时任务配置 ==========
      scheduling:
        enabled: true
        pool-size: 5
      
      # ========== 分布式锁配置 ==========
      lock:
        enabled: true
        type: redis
      
      # ========== 可观测性配置 ==========
      observability:
        type: otel
        service-name: enterprise-shell
        sampling-ratio: 1.0

# ==================== Actuator 配置 ====================

# ==================== Identity JWT Configuration ====================
identity:
  jwt:
    private-key-path: classpath:keys/private.pem
    issuer: brix-auth-center
    audience: enterprise-shell-api
    expiration: ${JWT_EXPIRATION:3600}
  # ========== Phase 0.3 — Login security configuration ==========
  security:
    # Account lockout: lock account after N consecutive failed login attempts
    max-failed-attempts: ${IDENTITY_MAX_FAILED_ATTEMPTS:5}
    lockout-minutes: ${IDENTITY_LOCKOUT_MINUTES:15}
    # IP-based rate limiting: max login requests per IP per time window
    rate-limit:
      max-attempts: ${IDENTITY_RATE_LIMIT_MAX:10}
      window-seconds: ${IDENTITY_RATE_LIMIT_WINDOW:60}

# ==================== Platform Security (D2/D3 — capability-driven) ====================
# 取代 identity.jwt.* 与 oauth2.google.*，由 platform-auth + platform-auth-web 消费。
# 旧配置 (identity.jwt.*, oauth2.google.*) 在 D4 阶段移除。
platform:
  security:
    jwt:
      enabled: true
      private-key-path: ${PLATFORM_JWT_PRIVATE_KEY_PATH:classpath:keys/private.pem}
      issuer: ${PLATFORM_JWT_ISSUER:brix-auth-center}
      audience: ${PLATFORM_JWT_AUDIENCE:enterprise-shell-api}
      access-token-expiration-seconds: ${PLATFORM_JWT_ACCESS_TTL:3600}
      identity-token-expiration-seconds: ${PLATFORM_JWT_IDENTITY_TTL:300}
      token-version: ${PLATFORM_JWT_TOKEN_VERSION:2}
    oauth2:
      google:
        # 留空时 OAuth2FederationCapability 不注册（host 可选启用）
        client-id: ${GOOGLE_OAUTH_CLIENT_ID:}

# ==================== Actuator 配置 ====================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      show-components: always
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,runtimeShellReadiness
  health:
    redis:
      enabled: true
    db:
      enabled: true

# ==================== Observability — Composite Health ====================
# Phase 5.1: Composite plugin health aggregator (Netflix Eureka pattern).
# All plugins implementing PluginHealthIndicator are auto-aggregated
# under /actuator/health/plugins — zero Host code required (Constraint 6).
observability:
  health:
    composite:
      enabled: true
    redis:
      enabled: true

# ==================== OpenTelemetry 配置 ====================
otel:
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
  service:
    name: enterprise-shell
  traces:
    exporter: otlp

---
# ============================================================
# booking-template profile — v3.0.10 Runtime Shell Bootstrap Gate
# ============================================================
spring:
  config:
    activate:
      on-profile: booking-template

brix:
  runtime-shell:
    required-plugins:
      - platform-tenant
      - app-booking

---
# ============================================================
# dev profile — Development-only Configuration
# ============================================================
# Phase 5.4: Slow query logging via datasource-proxy.
# Activated ONLY when spring.profiles.active includes "dev".
# Zero overhead in production — the auto-configuration is
# gated behind @Profile("dev").
# ============================================================
spring:
  config:
    activate:
      on-profile: dev

brix:
  datasource:
    slow-query:
      enabled: true
      threshold-millis: 500
      log-all-queries: false

logging:
  level:
    io.brix.platform.slowquery: WARN
