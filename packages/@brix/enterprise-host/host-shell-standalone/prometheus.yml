# ============================================================
# Prometheus 配置
# ============================================================
# 
# 用途：配置指标采集目标
# 模块：host-shell-standalone
#
# ============================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  
  external_labels:
    platform: brix
    environment: production

# 告警规则：docker-compose 把 ./prometheus-rules 挂载到 /etc/prometheus/rules
rule_files:
  - /etc/prometheus/rules/*.rules.yml

# 告警发往 compose full profile 中的 alertmanager
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  # Prometheus 自身指标
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # OpenTelemetry Collector 导出的指标
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']

  # 运行壳 Actuator 端点（管理端口 9081，只在容器网络内可达）
  - job_name: 'host-shell-standalone'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host-shell:9081']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: '(.+):(\d+)'
        replacement: '${1}'
