# ============================================================
# Prometheus 配置
# ============================================================
# 
# 用途：配置指标采集目标
# 模块：host-shell-standalone
#
# ============================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  
  external_labels:
    platform: shinwa
    environment: production

scrape_configs:
  # Prometheus 自身指标
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # OpenTelemetry Collector 导出的指标
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']

  # 运行壳 Actuator 端点
  - job_name: 'host-shell-standalone'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host-shell:8081']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: '(.+):(\d+)'
        replacement: '${1}'
