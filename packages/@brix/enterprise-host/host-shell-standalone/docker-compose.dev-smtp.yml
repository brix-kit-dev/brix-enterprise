# ============================================================
# Brix Enterprise - Development SMTP override
# ============================================================
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev-smtp.yml up -d --build
#
# This file is a development-only infrastructure overlay. It wires Spring Mail
# to Mailpit so platform-admin can deliver setup links through the
# NotificationCapability-backed SMTP path without exposing setup tokens through
# API responses.
#
# Mailpit SMTP and Web UI are bound to remote localhost only. Use SSH port forwarding:
#   ssh -L 1025:localhost:1025 -L 8025:localhost:8025 shinwa-vps
#   open http://localhost:8025
#
# ============================================================

services:
  host-shell:
    environment:
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: "1025"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "false"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "false"
      BRIX_INFRA_EMAIL_SMTP_ENABLED: "true"
      BRIX_INFRA_EMAIL_SMTP_FROM: ${BRIX_INFRA_EMAIL_SMTP_FROM:-platform-admin@brix.local}
      BRIX_INFRA_EMAIL_SMTP_TLS_ENABLED: "false"
      BRIX_INFRA_EMAIL_SMTP_CERTIFICATE_HOSTNAME_VALIDATION: "false"
      BRIX_PLATFORM_ADMIN_SETUP_MAIL_FROM: ${BRIX_PLATFORM_ADMIN_SETUP_MAIL_FROM:-platform-admin@brix.local}
    depends_on:
      mailpit:
        condition: service_started

  mailpit:
    image: axllent/mailpit:v1.29.7
    container_name: brix-mailpit
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    networks:
      - brix-network
