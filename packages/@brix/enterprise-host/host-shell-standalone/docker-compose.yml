# ============================================================
# Brix Enterprise - 产品模式 Docker Compose
# ============================================================
# 
# 用途：完整产品模式部署，包含所有基础设施依赖
# 模块：host-shell-standalone
#
# 启动命令：
#   docker compose up -d            # 核心服务（host-shell, postgres, kafka, redis）
#   docker compose --profile full up -d  # 完整服务（含可观测性组件）
#
# 停止命令：
#   docker compose down
#
# 查看日志：
#   docker compose logs -f host-shell
#
# Profiles:
#   - (default): 核心服务 - host-shell, postgres, kafka, redis
#   - full: 完整服务 - 包含 otel-collector, jaeger, prometheus, grafana
#
# ============================================================

services:
  # ============================================================
  # 运行壳（产品模式）
  # ============================================================
  host-shell:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: brix-host-shell-standalone
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=standalone
      - DEBUG=false
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/brix
      - SPRING_DATASOURCE_USERNAME=brix
      # 🔴 安全警告：密码通过 .env 文件或 secrets 管理
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - REDIS_HOST=redis
      - DB_HOST=postgres
      - DB_NAME=brix
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      # Brix Kafka EventBus 配置（brix.infra.kafka.bootstrap-servers）
      - BRIX_INFRA_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      # Canonical Outbox Relay (Layer 2B Runtime + Layer 2C JDBC/Kafka adapters).
      - BRIX_OUTBOX_RELAY_ENABLED=${BRIX_OUTBOX_RELAY_ENABLED:-true}
      - BRIX_OUTBOX_RELAY_OWNER=${BRIX_OUTBOX_RELAY_OWNER:-enterprise-shell}
      - BRIX_OUTBOX_RELAY_PERSISTENCE_ENABLED=${BRIX_OUTBOX_RELAY_PERSISTENCE_ENABLED:-true}
      - BRIX_OUTBOX_RELAY_PERSISTENCE_TABLE=${BRIX_OUTBOX_RELAY_PERSISTENCE_TABLE:-platform_tenant_outbox}
      # MinIO 文件存储能力 (Layer 2C Adapter — provides FileStorageCapability contract,
      # required by brix-app-storage plugin per its plugin-manifest.json)
      - BRIX_INFRA_MINIO_ENABLED=true
      - BRIX_INFRA_MINIO_ENDPOINT=http://minio:9000
      - BRIX_INFRA_MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - BRIX_INFRA_MINIO_SECRET_KEY=${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      - BRIX_INFRA_MINIO_BUCKET_NAME=${MINIO_BUCKET_NAME:-brix-storage}
      # Fallback Auth (dev-only stand-in until production OAuth Adapter is wired —
      # required by Capability Contract; gated to !production profile by Adapter)
      - BRIX_FALLBACK_AUTH_ENABLED=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_SERVICE_NAME=host-shell-standalone
      # =====================================================
      # Google OAuth2 Configuration
      # =====================================================
      # SECURITY: OAuth credentials must be provided via .env file.
      # No default values are allowed to prevent credential exposure.
      # Create a .env file with GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET.
      # =====================================================
      - IDENTITY_OAUTH2_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID is required. Create .env file with this value.}
      - IDENTITY_OAUTH2_GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:?GOOGLE_CLIENT_SECRET is required. Create .env file with this value.}
      # =====================================================
      # Token Encryption Key (AES-256-GCM)
      # =====================================================
      # SECURITY: Used by app-identity TokenEncryptionConverter to encrypt OAuth2
      # access/refresh/id tokens at rest in the social_connections table.
      # The Converter hashes the value with SHA-256 to derive a 256-bit AES key,
      # so any non-blank secret is accepted; use a >= 32-byte random value.
      # No default is permitted (security red line); fail-fast if missing.
      # Architecture: surfaced via ConfigStoreCapability (Layer 2C), Host stays thin.
      # =====================================================
      - TOKEN_ENCRYPTION_KEY=${TOKEN_ENCRYPTION_KEY:?TOKEN_ENCRYPTION_KEY is required. Create .env file with a 32+ byte random value (e.g. base64-encoded 32 bytes).}
      # Fallback Auth 配置（standalone 模式下启用 fallback 认证能力）
      - BRIX_FALLBACK_AUTH_ENABLED=true
      # =====================================================
      # Platform Admin setup-link delivery and Bootstrap configuration
      # =====================================================
      # SECURITY: setup links are delivered by NotificationCapability only.
      # Bootstrap uses a setup code to open a short-lived BOOTSTRAP_SETUP
      # session; no reusable bootstrap password is accepted or stored.
      # =====================================================
      - BRIX_PLATFORM_MFA_ISSUER=${BRIX_PLATFORM_MFA_ISSUER:-Brix}
      - BRIX_PLATFORM_MFA_ENCRYPTION_KEY=${BRIX_PLATFORM_MFA_ENCRYPTION_KEY:?BRIX_PLATFORM_MFA_ENCRYPTION_KEY is required. Create .env file with a base64-encoded 32-byte random value.}
      - BRIX_PLATFORM_ADMIN_SETUP_BASE_URL=${BRIX_PLATFORM_ADMIN_SETUP_BASE_URL:?BRIX_PLATFORM_ADMIN_SETUP_BASE_URL is required, e.g. https://console.example.com/platform/setup}
      # FIRST_OWNER invitation and setup links open the hosted pages of the identity protocol
      # surface (identity-auth BRX-IA-ONBOARD-002); they follow the issuer unless set here.
      - BRIX_TENANT_FIRST_OWNER_INVITE_BASE_URL=${BRIX_TENANT_FIRST_OWNER_INVITE_BASE_URL:-${BRIX_IDENTITY_PROVIDER_ISSUER:-}/auth/invitation}
      - BRIX_TENANT_FIRST_OWNER_SETUP_BASE_URL=${BRIX_TENANT_FIRST_OWNER_SETUP_BASE_URL:-${BRIX_IDENTITY_PROVIDER_ISSUER:-}/auth/setup}
      - BRIX_PLATFORM_ADMIN_SETUP_MAIL_FROM=${BRIX_PLATFORM_ADMIN_SETUP_MAIL_FROM:-}
      - BRIX_PLATFORM_ADMIN_SETUP_TOKEN_TTL_SECONDS=${BRIX_PLATFORM_ADMIN_SETUP_TOKEN_TTL_SECONDS:-86400}
      - BRIX_PLATFORM_ADMIN_SETUP_RETURN_URL_FOR_DEV_ONLY=${BRIX_PLATFORM_ADMIN_SETUP_RETURN_URL_FOR_DEV_ONLY:-false}
      - BRIX_PLATFORM_ADMIN_SETUP_LOGGING_NOTIFICATION_ENABLED=${BRIX_PLATFORM_ADMIN_SETUP_LOGGING_NOTIFICATION_ENABLED:-false}
      - BRIX_PLATFORM_NOTIFICATION_ENABLED=${BRIX_PLATFORM_NOTIFICATION_ENABLED:-true}
      - BRIX_PLATFORM_NOTIFICATION_DEFAULT_LOCALE=${BRIX_PLATFORM_NOTIFICATION_DEFAULT_LOCALE:-en-US}
      # Identity protocol surface: hosted login and BFF of the tenant console. The issuer is
      # the console origin, e.g. https://console.example.com (http://localhost:3001 in dev).
      - BRIX_IDENTITY_PROVIDER_ENABLED=${BRIX_IDENTITY_PROVIDER_ENABLED:-false}
      - BRIX_IDENTITY_PROVIDER_ISSUER=${BRIX_IDENTITY_PROVIDER_ISSUER:-}
      # SMTP is the production NotificationCapability adapter for setup links.
      # Leave these unset when using docker-compose.dev-smtp.yml (Mailpit) or
      # when another NotificationCapability bean is provided by the runtime.
      - BRIX_INFRA_EMAIL_SMTP_ENABLED=${BRIX_INFRA_EMAIL_SMTP_ENABLED:-true}
      - BRIX_INFRA_EMAIL_SMTP_FROM=${BRIX_INFRA_EMAIL_SMTP_FROM:-}
      - BRIX_INFRA_EMAIL_SMTP_TLS_ENABLED=${BRIX_INFRA_EMAIL_SMTP_TLS_ENABLED:-true}
      - BRIX_INFRA_EMAIL_SMTP_CERTIFICATE_HOSTNAME_VALIDATION=${BRIX_INFRA_EMAIL_SMTP_CERTIFICATE_HOSTNAME_VALIDATION:-true}
      - SPRING_MAIL_HOST=${SPRING_MAIL_HOST:-}
      - SPRING_MAIL_PORT=${SPRING_MAIL_PORT:-}
      - SPRING_MAIL_USERNAME=${SPRING_MAIL_USERNAME:-}
      - SPRING_MAIL_PASSWORD=${SPRING_MAIL_PASSWORD:-}
      - SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:-}
      - SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:-}
      - SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED:-}
      - BRIX_BOOTSTRAP_SUPER_ADMIN_ENABLED=${BRIX_BOOTSTRAP_SUPER_ADMIN_ENABLED:-true}
      - BRIX_BOOTSTRAP_SUPER_ADMIN_EMAIL=${BRIX_BOOTSTRAP_SUPER_ADMIN_EMAIL:?BRIX_BOOTSTRAP_SUPER_ADMIN_EMAIL is required. Create .env file with this value.}
      - BRIX_BOOTSTRAP_SUPER_ADMIN_USERNAME=${BRIX_BOOTSTRAP_SUPER_ADMIN_USERNAME:-Super Admin}
      - BRIX_BOOTSTRAP_SUPER_ADMIN_SETUP_CODE=${BRIX_BOOTSTRAP_SUPER_ADMIN_SETUP_CODE:?BRIX_BOOTSTRAP_SUPER_ADMIN_SETUP_CODE is required. Create .env file with this value.}
      - BRIX_PLATFORM_ADMIN_SETUP_BASE_URL=${BRIX_PLATFORM_ADMIN_SETUP_BASE_URL:?BRIX_PLATFORM_ADMIN_SETUP_BASE_URL is required. Create .env file with this value.}
      - BRIX_TENANT_FIRST_OWNER_INVITE_BASE_URL=${BRIX_TENANT_FIRST_OWNER_INVITE_BASE_URL:-${BRIX_IDENTITY_PROVIDER_ISSUER:-}/auth/invitation}
      - BRIX_TENANT_FIRST_OWNER_SETUP_BASE_URL=${BRIX_TENANT_FIRST_OWNER_SETUP_BASE_URL:-${BRIX_IDENTITY_PROVIDER_ISSUER:-}/auth/setup}
      - BRIX_BOOTSTRAP_SUPER_ADMIN_SETUP_CODE_TTL_SECONDS=${BRIX_BOOTSTRAP_SUPER_ADMIN_SETUP_CODE_TTL_SECONDS:-900}
      - BRIX_BOOTSTRAP_SUPER_ADMIN_SESSION_TTL_SECONDS=${BRIX_BOOTSTRAP_SUPER_ADMIN_SESSION_TTL_SECONDS:-300}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - brix-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ============================================================
  # PostgreSQL 数据库
  # ============================================================
  postgres:
    image: postgres:15-alpine
    container_name: brix-postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_DB=brix
      - POSTGRES_USER=brix
      # 🔴 安全警告：密码通过 .env 文件或 secrets 管理
      - POSTGRES_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - brix-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brix -d brix"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # Apache Kafka（消息总线 - KRaft 模式，无需 ZooKeeper）
  # ============================================================
  kafka:
    image: confluentinc/cp-kafka:7.7.0
    container_name: brix-kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      # KRaft 模式配置（无需 ZooKeeper）
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # 集群 ID（KRaft 必需，固定值用于开发环境）
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - brix-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 15s
      retries: 5
      start_period: 30s

  # ============================================================
  # Redis（状态存储 & 缓存）
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: brix-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - brix-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # MinIO（对象存储 - 提供 FileStorageCapability 契约的实现）
  # ------------------------------------------------------------
  # Architecture rationale (Blueprint v3.0.x §3 Capability Contract):
  #   - brix-app-storage 插件在 plugin-manifest.json 中声明 required:
  #     FileStorageCapability — 这是 vendor-neutral 的契约。
  #   - 唯一生产级实现在 infra-adapter-minio.MinioFileStorageCapability
  #     (Layer 2C Adapter)，由 MinioAutoConfiguration 在
  #     brix.infra.minio.enabled=true 时注册到 CapabilityRegistry。
  #   - 因此最小合规部署必须提供 MinIO 服务（或 S3 兼容对象存储），
  #     插件才能通过 PluginCapabilityVerifier 启动校验。
  # ============================================================
  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: brix-minio
    ports:
      - "127.0.0.1:9000:9000"   # S3 API
      - "127.0.0.1:9001:9001"   # Console UI
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - brix-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # OpenTelemetry Collector（可观测性）
  # Profile: full - 非核心服务，可选部署
  # ============================================================
  otel-collector:
    profiles: ["full"]
    image: otel/opentelemetry-collector-contrib:0.88.0
    container_name: brix-otel-collector
    ports:
      - "127.0.0.1:4317:4317"   # OTLP gRPC
      - "127.0.0.1:4318:4318"   # OTLP HTTP
      - "127.0.0.1:8888:8888"   # Prometheus metrics (collector)
      - "127.0.0.1:8889:8889"   # Prometheus exporter
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    networks:
      - brix-network

  # ============================================================
  # Jaeger（分布式追踪）
  # Profile: full - 非核心服务，可选部署
  # ============================================================
  jaeger:
    profiles: ["full"]
    image: jaegertracing/all-in-one:1.51
    container_name: brix-jaeger
    ports:
      - "127.0.0.1:16686:16686"  # Jaeger UI
      - "127.0.0.1:14250:14250"  # gRPC
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - brix-network

  # ============================================================
  # Prometheus（指标采集）
  # Profile: full - 非核心服务，可选部署
  # ============================================================
  prometheus:
    profiles: ["full"]
    image: prom/prometheus:v2.47.0
    container_name: brix-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus-rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - brix-network

  # ============================================================
  # Grafana（可视化仪表盘）
  # Profile: full - 非核心服务，可选部署
  # ============================================================
  grafana:
    profiles: ["full"]
    image: grafana/grafana:10.2.0
    container_name: brix-grafana
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      # 🔴 安全警告：密码通过 .env 文件或 secrets 管理
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - brix-network

networks:
  brix-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  minio_data:
  prometheus_data:
  grafana_data:
