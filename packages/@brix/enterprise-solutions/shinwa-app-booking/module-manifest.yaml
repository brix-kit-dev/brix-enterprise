# ===========================================================
# shinwa-app-booking 模块声明文件
# 
# 本文件定义模块的元信息、能力需求、事件声明、配置项等。
# Runtime Shell 通过此文件了解模块的能力契约，完成：
# - 能力注入
# - 事件路由
# - 配置绑定
# - 权限校验
# 
# 版本: 3.0.0
# 日期: 2026-01-28
# ===========================================================

# ===== 模块基本信息 =====
module:
  # 模块唯一标识（与 Maven artifactId 一致）
  id: shinwa-app-booking
  # 模块版本（遵循语义化版本）
  version: 3.0.0-SNAPSHOT
  # 模块显示名称
  name: 预约管理
  # 模块提供商（必填）
  vendor: Shinwa Solutions
  # 许可证类型
  license: Commercial
  # 模块描述
  description: |
    提供资源预约的完整业务能力，包括：
    - 可预约资源管理（医生、顾问、会议室等）
    - 时间槽配置与查询
    - 预约创建/确认/取消/完成
    - 预约日历展示
    - 预约通知（通过集成事件）

# ===== 生命周期配置 =====
lifecycle:
  # 启动优先级（数字越小越先启动）
  # 100: 默认优先级
  # 50: 基础模块（如认证）
  # 150: 业务模块
  startup-order: 150
  
  # 依赖的其他模块（按 moduleId 声明）
  # 预约模块依赖用户身份模块获取用户信息
  dependencies:
    - shinwa-app-identity

# ===== 能力需求声明 =====
capabilities:
  # 必需能力（缺失则启动失败）
  required:
    - EventBusCapability      # 事件发布（用于发布预约状态变更事件）
    - StateStoreCapability    # 状态存储（用于缓存热点数据）
    - AuthContextCapability   # 认证上下文（用于获取当前用户/租户）
    - ObservabilityCapability # 可观测性（日志/指标/追踪）
    - ConfigStoreCapability   # 配置存储（读取模块配置）

  # 可选能力（缺失则降级运行）
  optional:
    - LockCapability          # 分布式锁（用于防止时间槽超卖）
    # SchedulingCapability 已移除：待预约提醒功能实现后再添加

# ===== 事件声明 =====
events:
  # 本模块发布的集成事件
  publishes:
    # 预约创建事件
    - eventType: booking.created
      description: 预约创建成功后发布
      payload:
        bookingId: Long         # 预约ID
        bookingNo: String       # 预约编号
        resourceId: Long        # 资源ID
        resourceType: String    # 资源类型
        userId: Long            # 预约人ID
        tenantId: Long          # 租户ID
        reservedDate: LocalDate # 预约日期
        startTime: LocalTime    # 开始时间
        endTime: LocalTime      # 结束时间

    # 预约确认事件
    - eventType: booking.confirmed
      description: 预约被确认后发布
      payload:
        bookingId: Long
        bookingNo: String
        confirmedAt: LocalDateTime
        confirmedBy: Long

    # 预约取消事件
    - eventType: booking.cancelled
      description: 预约被取消后发布
      payload:
        bookingId: Long
        bookingNo: String
        cancelReason: String
        cancelledAt: LocalDateTime
        cancelledBy: Long

    # 预约完成事件
    - eventType: booking.completed
      description: 预约完成后发布
      payload:
        bookingId: Long
        bookingNo: String
        completedAt: LocalDateTime

    # 预约改期事件
    - eventType: booking.rescheduled
      description: 预约改期后发布
      payload:
        bookingId: Long
        bookingNo: String
        oldDate: LocalDate
        oldStartTime: LocalTime
        newDate: LocalDate
        newStartTime: LocalTime

  # 本模块订阅的集成事件
  subscribes:
    # 订阅用户禁用事件（自动取消其待处理预约）
    - eventType: identity.user.disabled
      handler: com.shinwa.app.booking.event.UserDisabledEventHandler#onUserDisabled
      description: 用户被禁用时取消其待处理的预约

# ===== 权限声明 =====
permissions:
  # 预约相关权限
  - id: booking:read
    name: 查看预约
    description: 查看预约列表和详情

  - id: booking:create
    name: 创建预约
    description: 创建新预约

  - id: booking:update
    name: 修改预约
    description: 修改预约信息、改期

  - id: booking:delete
    name: 取消预约
    description: 取消预约

  - id: booking:confirm
    name: 确认预约
    description: 确认待确认的预约

  - id: booking:complete
    name: 完成预约
    description: 将预约标记为已完成

  # 资源管理权限
  - id: booking:resource:read
    name: 查看资源
    description: 查看可预约资源列表

  - id: booking:resource:manage
    name: 管理资源
    description: 创建/修改/删除可预约资源

  - id: booking:timeslot:manage
    name: 管理时间槽
    description: 配置资源的可预约时间槽

# ===== 配置项声明 =====
config:
  # 预约业务配置
  - key: booking.max-days-ahead
    type: Integer
    default: 30
    description: 最大可提前预约天数

  - key: booking.default-cancel-deadline-hours
    type: Integer
    default: 24
    description: 默认取消截止时间（小时）

  - key: booking.default-slot-duration
    type: Integer
    default: 30
    description: 默认时间槽时长（分钟）

  - key: booking.enable-auto-confirm
    type: Boolean
    default: false
    description: 是否启用自动确认

  - key: booking.reminder-hours-before
    type: Integer
    default: 24
    description: 预约提醒提前时间（小时）

  # 缓存配置
  - key: booking.cache.slot-ttl-minutes
    type: Integer
    default: 5
    description: 时间槽缓存过期时间（分钟）

# ===== 容错配置 =====
resilience:
  # 熔断器配置
  circuit-breaker:
    enabled: true
    failure-rate-threshold: 50
    wait-duration-in-open-state: 30s
    permitted-number-of-calls-in-half-open-state: 10

  # 限流配置
  rate-limiter:
    enabled: true
    limit-for-period: 100
    limit-refresh-period: 1s
    timeout-duration: 500ms

  # 重试配置
  retry:
    enabled: true
    max-attempts: 3
    wait-duration: 500ms    # 死信队列配置（超过最大重试次数后进入 DLQ）
    dlq:
      enabled: true
      topic: booking.events.dlq
      retention-days: 7