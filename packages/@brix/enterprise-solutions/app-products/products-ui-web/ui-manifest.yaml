# ══════════════════════════════════════════════════════════════════════════════
# UI Manifest - 产品模块 UI 声明清单
# 
# 【设计原则】遵循 v3.0 Manifest-Driven 架构
# 1. 所有 UI 配置在此声明，插件代码不包含任何注册逻辑
# 2. Host 读取此文件进行统一装配
# 3. 插件只声明，Host 拥有最终决策权
# 
# @version 3.0.0
# @date 2026-01-31
# ══════════════════════════════════════════════════════════════════════════════

# ============================================================================
# 插件基本信息
# ============================================================================
plugin:
  id: "products"
  name: "产品管理"
  version: "3.0.0"
  description: "产品套餐展示与管理"
  vendor: "Brix Platform"
  icon: "Inventory"
  category: "business"

# ============================================================================
# 页面声明（替代路由注册）
# 【关键】插件不注册路由，只声明 PageId，Host 负责映射
# ============================================================================
pages:
  # -------------------- 产品目录（卡片视图 V2）--------------------
  - pageId: "products:catalog"
    component: "./pages/ProductListPageV2"
    title: "产品目录"
    titleKey: "products.page.catalog.title"
    permission: "products:read"
    platforms:
      web:
        suggestedPath: "/products/catalog"
      mobile:
        suggestedScreen: "ProductCatalogScreen"
    config:
      keepAlive: true
      breadcrumb:
        - label: "首页"
          pageId: "home"
        - label: "产品目录"

  # -------------------- 产品列表（卡片视图，已统一到 V2）--------------------
  # NOTE: 历史版本（ProductListPage 表格视图）违反约束 9（BrixUI 统一治理）：
  # 直接消费了未在 UIAdapter 契约内的 MUI 原始组件
  # （CardMedia / CardContent / Grid / FormControl / InputLabel / Dialog*）
  # 渲染时返回 undefined → React error #130。
  # 按 Manifest-Driven 原则，将 /products 重指向已治理合规的 V2 实现，
  # 旧 ProductListPage 同时从 rspack exposes 移除，避免再次被加载。
  - pageId: "products:list"
    component: "./pages/ProductListPageV2"
    title: "产品列表"
    titleKey: "products.page.list.title"
    permission: "products:read"
    platforms:
      web:
        suggestedPath: "/products"
      mobile:
        suggestedScreen: "ProductListScreen"
    config:
      keepAlive: true
      breadcrumb:
        - label: "首页"
          pageId: "home"
        - label: "产品管理"

  # -------------------- 产品详情 --------------------
  - pageId: "products:detail"
    component: "./pages/ProductDetailPage"
    title: "产品详情"
    titleKey: "products.page.detail.title"
    permission: "products:read"
    params:
      - name: "id"
        type: "string"
        required: true
    platforms:
      web:
        suggestedPath: "/products/:id"
      mobile:
        suggestedScreen: "ProductDetailScreen"
    config:
      breadcrumb:
        - label: "首页"
          pageId: "home"
        - label: "产品管理"
          pageId: "products:list"
        - label: "产品详情"

  # -------------------- 创建产品 --------------------
  - pageId: "products:create"
    component: "./pages/ProductCreatePage"
    title: "新建产品"
    titleKey: "products.page.create.title"
    permission: "products:write"
    platforms:
      web:
        suggestedPath: "/products/create"
      mobile:
        suggestedScreen: "ProductCreateScreen"
    config:
      breadcrumb:
        - label: "首页"
          pageId: "home"
        - label: "产品管理"
          pageId: "products:list"
        - label: "新建产品"

  # -------------------- 编辑产品 (Phase 5 Week 10) --------------------
  - pageId: "products:edit"
    component: "./pages/ProductEditPage"
    title: "编辑产品"
    titleKey: "products.page.edit.title"
    permission: "products:write"
    params:
      - name: "id"
        type: "string"
        required: true
    platforms:
      web:
        suggestedPath: "/products/:id/edit"
      mobile:
        suggestedScreen: "ProductEditScreen"
    config:
      breadcrumb:
        - label: "首页"
          pageId: "home"
        - label: "产品管理"
          pageId: "products:list"
        - label: "编辑产品"

# ============================================================================
# 菜单声明（替代菜单注册）
#
# 【菜单合并说明 · 2026-04-30】
# ProductListPageV2 已统一承载「目录浏览 / 列表 / 新建入口」三类交互
# （搜索 + 类型 Tab + 卡片网格 + 新建对话框），原先三个并列的子菜单
# （catalog / list / create）会让用户认为三处功能不同，与实际不符。
# 因此保留单一入口「产品管理」→ pageId: products:list，
# 由页面内部的「+ 新建套餐」按钮触发创建流程。
# 详情/编辑页通过卡片点击或 URL 直达，不在主菜单暴露。
# ============================================================================
menus:
  - id: "products"
    title: "产品管理"
    icon: "inventory"
    pageId: "products:list"
    order: 40
    permission: "products:read"

# ============================================================================
# 权限声明
# ============================================================================
permissions:
  - code: "products:read"
    name: "查看产品"
    description: "允许查看产品列表和详情"
  - code: "products:write"
    name: "编辑产品"
    description: "允许创建和编辑产品"
  - code: "products:delete"
    name: "删除产品"
    description: "允许删除产品"
  - code: "products:review"
    name: "审核产品"
    description: "允许审核产品上下架"

# ============================================================================
# 依赖配置
# ============================================================================
dependencies:
  api:
    baseUrl: "/api/v1/products"
    version: "v1"

# ============================================================================
# 开发服务器配置
# ============================================================================
devServer:
  port: 3004
