# ===========================================================================================
# Product Management Module Manifest
# ===========================================================================================
#
# This file defines the capabilities, lifecycle configuration, and event relationships
# for the Product Management plugin module.
# Follows the Brix Runtime SDK module-manifest.yaml specification.
#
# Version: 3.0.0
# Updated: 2026-03-23
# ===========================================================================================

# ===========================================================================================
# Module Information
# ===========================================================================================
module:
  # Unique module identifier
  id: "brix-app-products"

  # Display name
  name: "Product Management"

  # Module version
  version: "3.0.0-SNAPSHOT"

  # Module type: plugin (business functionality)
  type: "plugin"

  # Module category
  category: "business"

  # Vendor information
  vendor: "Brix Platform"

  # Module description
  description: |
    Product Management Plugin

    Core responsibilities:
    - Product catalog: maintain a catalog of available products and services
    - Package configuration: create and manage service packages
    - Pricing management: define and update product pricing tiers
    - Publishing workflow: manage product visibility and availability

    Provides product catalog, package configuration, and pricing management
    for medical tourism service offerings.

# ===========================================================================================
# Lifecycle Configuration
# ===========================================================================================
lifecycle:
  # Startup priority (lower number starts first)
  startup-order: 80

  # Required modules (must be ready before this module starts)
  depends-on: []

  # Health check configuration
  health-check:
    path: "/actuator/health/products"
    interval: 30
    timeout: 5

# ===========================================================================================
# Capability Requirements
# ===========================================================================================
capabilities:
  # Required capabilities (module fails to start if missing)
  required:
    - event-bus
    - state-store
    - http

  # Optional capabilities (module degrades gracefully if missing)
  optional:
    - file-storage
    - notification

# ===========================================================================================
# Event Declarations
# ===========================================================================================
events:
  # Published events
  publishes:
    - type: "io.brix.plugin.products.event.ProductCreated"
      description: "Published when a new product is created"

    - type: "io.brix.plugin.products.event.ProductUpdated"
      description: "Published when a product is updated"

    - type: "io.brix.plugin.products.event.ProductDeleted"
      description: "Published when a product is deleted"

    - type: "io.brix.plugin.products.event.ProductPublished"
      description: "Published when a product is made publicly available"

    - type: "io.brix.plugin.products.event.ProductPriceChanged"
      description: "Published when a product's price is changed"

  # Subscribed events
  subscribes:
    - type: "io.brix.plugin.partners.event.PartnerStatusChanged"
      description: "When a partner status changes, update associated product availability"

# ===========================================================================================
# Permission Declarations
# ===========================================================================================
permissions:
  - id: "products:manage"
    name: "Manage Products"
    description: "Full management access to products"

  - id: "products:read"
    name: "View Products"
    description: "Read-only access to product information"

  - id: "products:publish"
    name: "Publish Products"
    description: "Permission to publish and unpublish products"

  - id: "products:price:manage"
    name: "Manage Pricing"
    description: "Permission to create and update product pricing"

# ===========================================================================================
# Configuration Declarations
# ===========================================================================================
config:
  - key: "products.max-images-per-product"
    type: "int"
    default: "20"
    description: "Maximum number of images allowed per product"

  - key: "products.price-change-approval"
    type: "boolean"
    default: "true"
    description: "Whether price changes require approval before taking effect"

# ===========================================================================================
