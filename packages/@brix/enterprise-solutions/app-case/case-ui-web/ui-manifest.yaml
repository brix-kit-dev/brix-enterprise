# ══════════════════════════════════════════════════════════════════════════════
# UI Manifest - Case管理模块 UI 声明清单
# 
# 【设计原则】遵循 v3.0.6 Manifest-Driven 架构
# 1. 所有 UI 配置在此声明，插件代码不包含任何注册逻辑
# 2. Host 读取此文件进行统一装配
# 3. 插件只声明，Host 拥有最终决策权
# 4. 声明 WHAT（菜单、页面、权限），不声明 HOW（加载技术）
# 
# @version 3.0.0
# @date 2026-02-28
# ══════════════════════════════════════════════════════════════════════════════

# ============================================================================
# 插件基本信息
# ============================================================================
plugin:
  id: "case"
  name: "Case管理"
  version: "3.0.0-SNAPSHOT"
  description: "Brix Enterprise Case Management - 客户案例跟踪、工作流管理"
  vendor: "Brix Platform"
  icon: "Folder"
  category: "business"

# ============================================================================
# 页面声明（替代路由注册）
# 【关键】插件不注册路由，只声明 PageId，Host 负责映射
# ============================================================================
pages:
  # -------------------- Case列表 --------------------
  - pageId: "case:list"
    component: "./pages/CaseList"
    title: "Case列表"
    titleKey: "case.page.list.title"
    permission: "case:read"
    platforms:
      web:
        suggestedPath: "/case"
      mobile:
        suggestedScreen: "CaseListScreen"
    config:
      keepAlive: true
      breadcrumb:
        - label: "首页"
          pageId: "home"
        - label: "Case管理"

  # -------------------- Case详情 --------------------
  - pageId: "case:detail"
    component: "./pages/CaseDetail"
    title: "Case详情"
    titleKey: "case.page.detail.title"
    permission: "case:read"
    params:
      - name: "id"
        type: "string"
        required: true
    platforms:
      web:
        suggestedPath: "/case/:id"
      mobile:
        suggestedScreen: "CaseDetailScreen"
    config:
      breadcrumb:
        - label: "首页"
          pageId: "home"
        - label: "Case管理"
          pageId: "case:list"
        - label: "Case详情"

  # -------------------- 创建Case --------------------
  - pageId: "case:create"
    component: "./pages/CaseCreate"
    title: "创建Case"
    titleKey: "case.page.create.title"
    permission: "case:write"
    platforms:
      web:
        suggestedPath: "/case/create"
      mobile:
        suggestedScreen: "CaseCreateScreen"
    config:
      breadcrumb:
        - label: "首页"
          pageId: "home"
        - label: "Case管理"
          pageId: "case:list"
        - label: "创建Case"

  # -------------------- 编辑Case --------------------
  - pageId: "case:edit"
    component: "./pages/CaseEdit"
    title: "编辑Case"
    titleKey: "case.page.edit.title"
    permission: "case:write"
    params:
      - name: "id"
        type: "string"
        required: true
    platforms:
      web:
        suggestedPath: "/case/:id/edit"
      mobile:
        suggestedScreen: "CaseEditScreen"
    config:
      breadcrumb:
        - label: "首页"
          pageId: "home"
        - label: "Case管理"
          pageId: "case:list"
        - label: "编辑Case"

# ============================================================================
# 菜单声明（替代菜单注册）
# 【关键】关联 PageId 而非 path
# ============================================================================
menus:
  - id: "case"
    title: "Case管理"
    icon: "folder"
    order: 100
    permission: "case:read"
    children:
      - id: "case:list"
        title: "Case列表"
        pageId: "case:list"
        icon: "list"
        order: 1
      - id: "case:create"
        title: "创建Case"
        pageId: "case:create"
        icon: "add"
        order: 2
        permission: "case:write"

# ============================================================================
# 权限声明
# ============================================================================
permissions:
  - code: "case:read"
    name: "查看Case"
    description: "允许查看Case列表和详情"
  - code: "case:write"
    name: "编辑Case"
    description: "允许创建和编辑Case"
  - code: "case:delete"
    name: "删除Case"
    description: "允许删除Case"
  - code: "case:assign"
    name: "分配Case"
    description: "允许将Case分配给其他用户"
  - code: "case:close"
    name: "关闭Case"
    description: "允许关闭Case"

# ============================================================================
# 能力依赖（运行时注入）
# ============================================================================
capabilities:
  required:
    - http
    - auth
    - navigation
  optional:
    - theme
    - i18n
    - notification

# ============================================================================
# 开发服务器配置
# ============================================================================
devServer:
  port: 3050
  host: "localhost"

