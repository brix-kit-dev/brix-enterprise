server:
  port: 8083

spring:
  application:
    name: carousel-server
  datasource:
    url: jdbc:postgresql://localhost:5432/carousel
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

# 日志配置
logging:
  level:
    io.brix.enterprise.app.app.carousel: DEBUG
    org.springframework.web: INFO
