# ══════════════════════════════════════════════════════════════════════════════
# UI Manifest - 轮播组件 Mobile UI 声明清单
# 
# 【设计原则】遵循 v3.0 Manifest-Driven 架构
# 1. 所有 UI 配置在此声明，插件代码不包含任何注册逻辑
# 2. Host 读取此文件进行统一装配
# 3. 插件只声明，Host 拥有最终决策权
# 
# 【模块类型】可嵌入组件模块（非页面插件）
# - 本模块只导出 CarouselView 组件供其他插件嵌入使用
# - 不包含独立页面，因此 pages 为空数组
# 
# @version 3.0.0
# @date 2026-01-31
# ══════════════════════════════════════════════════════════════════════════════

# ============================================================================
# 插件基本信息
# ============================================================================
plugin:
  id: "carousel"
  name: "轮播组件"
  version: "3.0.0"
  description: "轮播组件，支持自动播放、指示器、点击事件"
  vendor: "Brix Platform"
  icon: "ViewCarousel"
  platform: "mobile"
  type: "component-library"  # 组件库类型，非页面插件

# ============================================================================
# 导出配置 - 可嵌入组件
# ============================================================================
exports:
  components:
    - name: "CarouselView"
      path: "./src/components/CarouselView"
      description: "轮播组件，支持自动播放、指示器、点击事件"
      props:
        - name: "code"
          type: "string"
          required: true
          description: "轮播位编码"
        - name: "height"
          type: "number"
          default: 200
          description: "轮播高度"
        - name: "onBannerPress"
          type: "function"
          description: "Banner点击回调"
        - name: "renderBanner"
          type: "function"
          description: "自定义Banner渲染"

# ============================================================================
# 页面声明
# 【说明】本模块是可嵌入组件库，不包含独立页面
# ============================================================================
pages: []

# ============================================================================
# 依赖配置
# ============================================================================
dependencies:
  api: "carousel-server"
  port: 8083

# ============================================================================
# 开发服务器配置
# ============================================================================
devServer:
  port: 4003
