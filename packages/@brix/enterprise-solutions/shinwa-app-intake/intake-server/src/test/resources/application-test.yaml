# ============================================================================
# Intake Module Test Configuration
# ============================================================================
# Integration test configuration for Intake module E2E tests.
# Uses H2 in-memory database for test isolation.
#
# Author: Shinwa Team
# Version: 3.0.0-SNAPSHOT
# Date: 2026-02-24
# ============================================================================

spring:
  application:
    name: intake-test

  # ----- Database Configuration -----
  datasource:
    url: jdbc:h2:mem:intake_test_db;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # ----- JPA Configuration -----
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  # ----- H2 Console -----
  h2:
    console:
      enabled: true
      path: /h2-console

# ============================================================================
# Runtime Context Mock Configuration
# ============================================================================
runtime:
  context:
    tenant-id: test-tenant
    auth:
      enabled: false
      mock-user-id: test-user
    eventbus:
      type: in-memory
    observability:
      metrics-enabled: false
      tracing-enabled: false

# ============================================================================
# Logging Configuration
# ============================================================================
logging:
  level:
    root: WARN
    com.shinwa.app.intake: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG

# ============================================================================
# Server Configuration
# ============================================================================
server:
  port: 0
