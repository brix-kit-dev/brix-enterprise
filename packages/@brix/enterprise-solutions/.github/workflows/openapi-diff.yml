# ============================================================================
# OpenAPI Breaking-Change Detection CI (R9.6 Fix)
# ============================================================================
#
# [Purpose]
# Detects backward-incompatible (breaking) changes in OpenAPI specs during
# Pull Requests. This ensures API consumers are not silently broken.
#
# [How It Works]
# 1. Checks out the base branch (main/develop) and generates OpenAPI specs
#    by starting each Spring Boot module and hitting /v3/api-docs.
# 2. Checks out the PR branch and does the same.
# 3. Compares base vs head specs using oasdiff — a popular OpenAPI diff tool.
# 4. Posts a PR comment if breaking changes are detected.
#
# [Breaking Change Examples]
# - Removing an endpoint
# - Removing a required request/response field
# - Changing a field type
# - Adding a new required request parameter
#
# [Architecture Reference]
# Phase 2 Task 2.4 — Architecture Review R9.6 fix
# See: 架构评审报告与分阶段改造计划-v3.0.9-20260325.md
# ============================================================================

name: OpenAPI Diff (Breaking Change Detection)

on:
  pull_request:
    branches: [main, develop]
    paths:
      - '**/src/main/java/**/*.java'
      - '**/pom.xml'
      - '**/resources/application*.yml'
      - '**/resources/application*.yaml'
      - '**/resources/application*.properties'

permissions:
  pull-requests: write
  contents: read

# Cancel in-flight runs for the same PR to save resources
concurrency:
  group: openapi-diff-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  openapi-diff:
    name: OpenAPI Breaking Change Check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        module:
          - name: identity-server
            app-dir: app-identity
            port: 8081
          - name: booking-server
            app-dir: app-booking
            port: 8082

    steps:
      # ========================================
      # Setup
      # ========================================
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install oasdiff
        run: |
          curl -sSfL https://raw.githubusercontent.com/Tufin/oasdiff/main/install.sh | sh -s -- -b /usr/local/bin

      # ========================================
      # Generate BASE branch OpenAPI spec
      # ========================================
      - name: Checkout base branch (${{ github.base_ref }})
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          path: base

      - name: Build base branch
        working-directory: base
        run: mvn clean install -DskipTests -B -q

      - name: Generate base OpenAPI spec (${{ matrix.module.name }})
        working-directory: base/${{ matrix.module.app-dir }}
        run: |
          echo "📄 Generating BASE spec for ${{ matrix.module.name }}..."
          mvn -pl ${{ matrix.module.name }} spring-boot:run \
            -Dspring-boot.run.profiles=test \
            -Dspring-boot.run.arguments="--server.port=${{ matrix.module.port }}" &
          APP_PID=$!

          # Wait for app to be ready (max 120s)
          for i in $(seq 1 60); do
            if curl -sf http://localhost:${{ matrix.module.port }}/v3/api-docs > /dev/null 2>&1; then
              echo "✅ Base app ready"
              break
            fi
            sleep 2
          done

          curl -sf http://localhost:${{ matrix.module.port }}/v3/api-docs \
            > /tmp/openapi-base-${{ matrix.module.name }}.json || true
          kill $APP_PID 2>/dev/null || true
          sleep 2

          if [ ! -s /tmp/openapi-base-${{ matrix.module.name }}.json ]; then
            echo "⚠️ Base spec not generated (module may be new). Skipping diff."
            echo "SKIP_DIFF=true" >> $GITHUB_ENV
          fi

      # ========================================
      # Generate HEAD (PR) branch OpenAPI spec
      # ========================================
      - name: Checkout PR branch
        if: env.SKIP_DIFF != 'true'
        uses: actions/checkout@v4
        with:
          path: head

      - name: Build PR branch
        if: env.SKIP_DIFF != 'true'
        working-directory: head
        run: mvn clean install -DskipTests -B -q

      - name: Generate PR OpenAPI spec (${{ matrix.module.name }})
        if: env.SKIP_DIFF != 'true'
        working-directory: head/${{ matrix.module.app-dir }}
        run: |
          echo "📄 Generating HEAD spec for ${{ matrix.module.name }}..."
          mvn -pl ${{ matrix.module.name }} spring-boot:run \
            -Dspring-boot.run.profiles=test \
            -Dspring-boot.run.arguments="--server.port=${{ matrix.module.port }}" &
          APP_PID=$!

          for i in $(seq 1 60); do
            if curl -sf http://localhost:${{ matrix.module.port }}/v3/api-docs > /dev/null 2>&1; then
              echo "✅ PR app ready"
              break
            fi
            sleep 2
          done

          curl -sf http://localhost:${{ matrix.module.port }}/v3/api-docs \
            > /tmp/openapi-head-${{ matrix.module.name }}.json || true
          kill $APP_PID 2>/dev/null || true

          if [ ! -s /tmp/openapi-head-${{ matrix.module.name }}.json ]; then
            echo "❌ Failed to generate PR spec for ${{ matrix.module.name }}"
            exit 1
          fi

      # ========================================
      # Compare specs
      # ========================================
      - name: Run oasdiff breaking-change check
        if: env.SKIP_DIFF != 'true'
        id: diff
        run: |
          BASE=/tmp/openapi-base-${{ matrix.module.name }}.json
          HEAD=/tmp/openapi-head-${{ matrix.module.name }}.json

          echo "🔍 Checking for breaking changes in ${{ matrix.module.name }}..."

          # Generate full changelog
          oasdiff changelog "$BASE" "$HEAD" --format text > /tmp/changelog-${{ matrix.module.name }}.txt 2>&1 || true

          # Check for breaking changes (exit code 1 = breaking changes found)
          if oasdiff breaking "$BASE" "$HEAD" --format text > /tmp/breaking-${{ matrix.module.name }}.txt 2>&1; then
            echo "✅ No breaking changes in ${{ matrix.module.name }}"
            echo "has_breaking=false" >> $GITHUB_OUTPUT
          else
            echo "⚠️ Breaking changes detected in ${{ matrix.module.name }}"
            echo "has_breaking=true" >> $GITHUB_OUTPUT
            cat /tmp/breaking-${{ matrix.module.name }}.txt
          fi

      - name: Post PR comment on breaking changes
        if: env.SKIP_DIFF != 'true' && steps.diff.outputs.has_breaking == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const breaking = fs.readFileSync('/tmp/breaking-${{ matrix.module.name }}.txt', 'utf8');
            const changelog = fs.readFileSync('/tmp/changelog-${{ matrix.module.name }}.txt', 'utf8');

            const body = [
              '## ⚠️ OpenAPI Breaking Changes Detected — `${{ matrix.module.name }}`',
              '',
              '### Breaking Changes',
              '```',
              breaking.substring(0, 3000),
              '```',
              '',
              '<details><summary>Full Changelog</summary>',
              '',
              '```',
              changelog.substring(0, 10000),
              '```',
              '</details>',
              '',
              '---',
              '> If these changes are intentional, add a `api-breaking-change` label to this PR.',
              '> See [Architecture Review R9.6](../docs-dev/架构评审报告与分阶段改造计划-v3.0.9-20260325.md) for API governance rules.',
            ].join('\n');

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Fail on breaking changes (unless labeled)
        if: env.SKIP_DIFF != 'true' && steps.diff.outputs.has_breaking == 'true'
        run: |
          echo "❌ Breaking API changes detected in ${{ matrix.module.name }}."
          echo "   Add label 'api-breaking-change' to acknowledge, or fix the breaking changes."
          exit 1
