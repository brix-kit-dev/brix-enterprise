# ============================================================================
# Pact Contract Testing CI（Phase 5.3-3）
# ============================================================================
# 
# 【功能说明】
# 此 CI 管线执行 Consumer-Driven Contract Testing：
# 1. 前端 Consumer 测试 → 生成 Pact 契约文件
# 2. 后端 Provider 验证 → 验证是否满足 Consumer 期望
# 3. 两端都通过才允许 PR 合并
# 
# 【工作流程】
# booking-ui-web (Consumer)         booking-server (Provider)
#   ↓ vitest + @pact-foundation       ↓ JUnit + PactVerifier
#   生成 pacts/*.json                  验证 pacts/*.json
#           ↓                                   ↓
#           └──── CI: 两端都通过才允许 merge ────┘
# 
# 【Phase 5.3-3】
# CI 增加 Pact 验证步骤：前端 Consumer 测试 → 生成 Pact → 后端 Provider 验证
# ============================================================================

name: Pact Contract Testing

on:
  push:
    branches: [main, develop]
    paths:
      - '**/src/main/java/**/*.java'
      - '**/*-shared/**/*.ts'
      - '**/pacts/**/*.json'
  pull_request:
    branches: [main, develop]
    paths:
      - '**/src/main/java/**/*.java'
      - '**/*-shared/**/*.ts'
      - '**/pacts/**/*.json'
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  JAVA_VERSION: '21'
  PNPM_VERSION: '9'

jobs:
  # ========================================
  # Consumer 契约测试（前端）
  # ========================================
  consumer-tests:
    name: Consumer Contract Tests
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        module:
          - booking
          # 后续添加其他模块
          # - identity
          # - carousel
          # - contracts
          # - messenger
          # - partners
          # - products
          # - storage

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}
      
      - name: Install dependencies
        working-directory: app-${{ matrix.module }}
        run: pnpm install
      
      - name: Run Consumer Pact tests
        working-directory: app-${{ matrix.module }}/${{ matrix.module }}-shared
        run: pnpm test:pact
      
      - name: Upload Pact contracts
        uses: actions/upload-artifact@v4
        with:
          name: pact-contracts-${{ matrix.module }}
          path: app-${{ matrix.module }}/${{ matrix.module }}-shared/pacts/
          retention-days: 7

  # ========================================
  # Provider 契约验证（后端）
  # ========================================
  provider-verification:
    name: Provider Contract Verification
    runs-on: ubuntu-latest
    needs: consumer-tests
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      matrix:
        module:
          - booking
          # 后续添加其他模块

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Download Pact contracts
        uses: actions/download-artifact@v4
        with:
          name: pact-contracts-${{ matrix.module }}
          path: app-${{ matrix.module }}/${{ matrix.module }}-shared/pacts/
      
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'
      
      - name: Build project
        run: mvn clean install -DskipTests -B
      
      - name: Run Provider Pact verification
        working-directory: app-${{ matrix.module }}
        run: |
          echo "🔍 验证 ${{ matrix.module }}-server Provider 契约..."
          mvn -pl ${{ matrix.module }}-server test -Dtest=*PactProviderTest -B
      
      - name: Upload verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pact-verification-${{ matrix.module }}
          path: |
            app-${{ matrix.module }}/${{ matrix.module }}-server/target/pact-reports/
          retention-days: 7

  # ========================================
  # 契约测试结果汇总
  # ========================================
  pact-summary:
    name: Contract Testing Summary
    runs-on: ubuntu-latest
    needs: [consumer-tests, provider-verification]
    if: always()
    
    steps:
      - name: Check results
        run: |
          echo "## Pact Contract Testing Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.consumer-tests.result }}" == "success" ]; then
            echo "✅ Consumer Tests: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Consumer Tests: Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.provider-verification.result }}" == "success" ]; then
            echo "✅ Provider Verification: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Provider Verification: Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Contract Testing Workflow" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo 'Consumer (Frontend)        Provider (Backend)' >> $GITHUB_STEP_SUMMARY
          echo '  ↓ pnpm test:pact           ↓ mvn test *PactProviderTest' >> $GITHUB_STEP_SUMMARY
          echo '  生成 pacts/*.json           验证 pacts/*.json' >> $GITHUB_STEP_SUMMARY
          echo '          ↓                           ↓' >> $GITHUB_STEP_SUMMARY
          echo '          └──── 两端都通过才合并 ────┘' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Fail if any check failed
        if: needs.consumer-tests.result != 'success' || needs.provider-verification.result != 'success'
        run: |
          echo "❌ Contract testing failed. Both consumer and provider tests must pass."
          exit 1
