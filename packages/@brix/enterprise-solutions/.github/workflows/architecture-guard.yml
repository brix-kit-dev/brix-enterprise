# ============================================================================
# Architecture Guard CI - Comprehensive Architecture Validation
# ============================================================================
#
# This CI pipeline enforces architectural rules from the Architecture Review
# Checklist (附录C). Applicable checks for enterprise-solutions are implemented here.
#
# ============================================================================
# 附录C 可 CI 化检查项对照表
# ============================================================================
#
# | ID        | Check                              | Implementation      |
# |-----------|------------------------------------|--------------------|
# | R1.1-R1.4 | Plugin core no infra dependency    | ArchUnit tests     |
# | BP3/OS9   | Build artifacts not in Git         | git ls-files       |
# | BP4/OS1   | Secret leak detection              | gitleaks           |
# | RM1       | No .class files in source dirs     | find check         |
#
# 【Business Module Architecture Rules】
# - Business modules must follow layered architecture: API -> Core -> Server
# - Business modules access infrastructure only via Capability interfaces
# - Cross-business-module direct dependencies are forbidden
# ============================================================================

name: Architecture Guard

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  # ========================================
  # 🔐 BP4/OS1: Secret Leak Detection
  # ========================================
  secret-scan:
    name: Secret Leak Scan (BP4/OS1)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # ========================================
  # 📦 BP3/OS9: Build Artifacts Check
  # ========================================
  build-artifacts-check:
    name: Build Artifacts Not in Git (BP3/OS9)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Check for committed build artifacts
        run: |
          echo "🔍 Checking for committed build artifacts..."
          
          found=false
          
          DIST_FILES=$(git ls-files | grep -E "^dist/|/dist/" || true)
          if [ -n "$DIST_FILES" ]; then
            echo "❌ Found dist/ files committed to Git"
            found=true
          fi
          
          TARGET_FILES=$(git ls-files | grep -E "^target/|/target/" || true)
          if [ -n "$TARGET_FILES" ]; then
            echo "❌ Found target/ files committed to Git"
            found=true
          fi
          
          if [ "$found" = true ]; then
            exit 1
          else
            echo "✅ No build artifacts found in Git"
          fi

  # ========================================
  # ☕ RM1: No .class Files in Source
  # ========================================
  class-files-check:
    name: No .class in Source (RM1)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Check for .class files in source directories
        run: |
          echo "🔍 Checking for .class files in source directories..."
          
          CLASS_FILES=$(find . -path "*/src/*" -name "*.class" -type f ! -path "*/target/*" 2>/dev/null || true)
          
          if [ -n "$CLASS_FILES" ]; then
            echo "❌ Found .class files in source directories:"
            echo "$CLASS_FILES"
            exit 1
          else
            echo "✅ No .class files found in source directories"
          fi

  # ========================================
  # Java 架构测试
  # ========================================
  java-architecture:
    name: Java Architecture Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with: 
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      
      - name: Run Architecture Tests
        run: mvn test -Dtest="*ArchitectureTest" --fail-at-end -B
      
      - name: Check Layered Architecture
        run: |
          echo "🔍 检查业务模块分层架构..."
          
          for app in app-*; do
            if [ -d "$app" ]; then
              app_name=$(basename "$app")
              echo "📦 检查 $app_name..."
              
              # 检查必要的子模块
              has_api=false
              has_core=false
              has_server=false
              
              for subdir in "$app"/*; do
                if [ -d "$subdir" ]; then
                  subname=$(basename "$subdir")
                  case "$subname" in
                    *-api) has_api=true ;;
                    *-core) has_core=true ;;
                    *-server) has_server=true ;;
                  esac
                fi
              done
              
              if [ "$has_api" = true ] && [ "$has_core" = true ] && [ "$has_server" = true ]; then
                echo "  ✅ 分层完整 (API/Core/Server)"
              else
                echo "  ⚠️  分层不完整"
                [ "$has_api" = false ] && echo "    - 缺少 API 层"
                [ "$has_core" = false ] && echo "    - 缺少 Core 层"
                [ "$has_server" = false ] && echo "    - 缺少 Server 层"
              fi
            fi
          done
      
      - name: Check Direct Infrastructure Usage
        run: |
          echo "🔍 检查业务模块是否直接使用基础设施..."
          
          # 禁止的直接基础设施使用
          forbidden_patterns=(
            "import org.apache.kafka"
            "import redis.clients"
            "import io.minio"
            "import software.amazon.awssdk"
          )
          
          found_violations=false
          
          for app in app-*; do
            if [ -d "$app" ]; then
              for pattern in "${forbidden_patterns[@]}"; do
                matches=$(grep -r -l "$pattern" "$app" --include="*.java" 2>/dev/null || true)
                if [ -n "$matches" ]; then
                  echo "❌ 在 $(basename "$app") 中发现直接基础设施导入:"
                  echo "   $pattern"
                  echo "   文件: $matches"
                  found_violations=true
                fi
              done
            fi
          done
          
          if [ "$found_violations" = true ]; then
            echo ""
            echo "⚠️  业务模块应通过 Capability 接口访问基础设施"
            echo "    例如：使用 EventBusCapability 而非直接使用 Kafka"
            exit 1
          else
            echo "✅ 业务模块未发现直接基础设施使用"
          fi
      
      - name: Check Cross-App Dependencies
        run: |
          echo "🔍 检查跨业务模块依赖..."
          
          found_violations=false
          
          for app in app-*; do
            if [ -d "$app" ]; then
              app_name=$(basename "$app" | sed 's/app-//')
              
              # 检查是否依赖其他业务模块的 Core/Server 层
              for other_app in app-*; do
                other_name=$(basename "$other_app" | sed 's/app-//')
                
                if [ "$app_name" != "$other_name" ]; then
                  # 检查是否依赖其他模块的 core 或 server
                  for pom in "$app"/*/pom.xml; do
                    if [ -f "$pom" ]; then
                      if grep -q "${other_name}-core\|${other_name}-server" "$pom"; then
                        echo "❌ $(basename "$app") 直接依赖 $other_name 的 Core/Server 层"
                        found_violations=true
                      fi
                    fi
                  done
                fi
              done
            fi
          done
          
          if [ "$found_violations" = true ]; then
            echo ""
            echo "⚠️  业务模块之间只能通过 API 层依赖"
            echo "    禁止依赖其他模块的 Core/Server 层"
            exit 1
          else
            echo "✅ 业务模块间依赖关系正确"
          fi

  # ========================================
  # Maven Enforcer 规则检查
  # ========================================
  maven-enforcer:
    name: Maven Enforcer Rules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with: 
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      
      - name: Run Enforcer
        run: mvn enforcer:enforce -B

  # ========================================
  # 📋 Architecture Guard Summary
  # ========================================
  guard-summary:
    name: Architecture Guard Summary
    runs-on: ubuntu-latest
    needs: [secret-scan, build-artifacts-check, class-files-check, java-architecture, maven-enforcer]
    if: always()
    steps:
      - name: Check all jobs
        run: |
          echo "============================================"
          echo "Architecture Guard - 附录C 检查结果汇总"
          echo "============================================"
          echo ""
          echo "| Check ID   | Job                     | Status |"
          echo "|------------|-------------------------|--------|"
          echo "| BP4/OS1    | Secret Leak Scan        | ${{ needs.secret-scan.result }} |"
          echo "| BP3/OS9    | Build Artifacts Check   | ${{ needs.build-artifacts-check.result }} |"
          echo "| RM1        | No .class in Source     | ${{ needs.class-files-check.result }} |"
          echo "| R1.1-R1.4  | Java Architecture       | ${{ needs.java-architecture.result }} |"
          echo "| Enforcer   | Maven Enforcer          | ${{ needs.maven-enforcer.result }} |"
          echo ""
          
          # Check if any job failed
          if [ "${{ needs.secret-scan.result }}" = "failure" ] || \
             [ "${{ needs.build-artifacts-check.result }}" = "failure" ] || \
             [ "${{ needs.class-files-check.result }}" = "failure" ] || \
             [ "${{ needs.java-architecture.result }}" = "failure" ] || \
             [ "${{ needs.maven-enforcer.result }}" = "failure" ]; then
            echo "❌ Some architecture checks failed. Please fix before merging."
            exit 1
          else
            echo "✅ All architecture checks passed!"
          fi