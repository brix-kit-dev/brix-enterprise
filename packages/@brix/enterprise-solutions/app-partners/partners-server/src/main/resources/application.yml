# =====================================================
# 合作伙伴管理服务配置
# Brix App - Partners
# 端口：8084
# =====================================================

server:
  port: 8084

spring:
  application:
    name: brix-partners-server
  
  # =====================================================
  # Data Source Configuration
  # =====================================================
  # SECURITY: All credentials must be provided via environment variables.
  # No default values are allowed to prevent accidental production exposure.
  # =====================================================
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:brix_partners}}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
  
  # JPA 配置
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

# 日志配置
logging:
  level:
    io.brix.enterprise.app.app.partners: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
