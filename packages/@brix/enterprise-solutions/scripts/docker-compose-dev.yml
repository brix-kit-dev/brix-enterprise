# ============================================================
# Shinwa Solutions - Development Infrastructure
# ============================================================
#
# This Docker Compose file provides common development
# infrastructure for all shinwa-app-* modules.
#
# Usage:
#   docker compose -f scripts/docker-compose-dev.yml up -d
#
# Services:
#   - PostgreSQL: localhost:5432 (brix/brix123)
#   - Redis: localhost:6379
#   - Adminer (DB UI): http://localhost:8092
#   - MailHog (Email): http://localhost:8025
#
# ============================================================

services:
  # ==================== PostgreSQL ====================
  # Primary database for all business modules
  postgres:
    image: postgres:16-alpine
    container_name: shinwa-dev-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-brix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brix123}
      POSTGRES_DB: ${POSTGRES_DB:-brix_platform}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-brix} -d ${POSTGRES_DB:-brix_platform}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shinwa-dev

  # ==================== Redis ====================
  # Session storage and caching
  redis:
    image: redis:7-alpine
    container_name: shinwa-dev-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shinwa-dev

  # ==================== Adminer (Database UI) ====================
  # Web-based database management
  adminer:
    image: adminer:4
    container_name: shinwa-dev-adminer
    ports:
      - "8092:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    networks:
      - shinwa-dev

  # ==================== MailHog (Email Testing) ====================
  # Captures outgoing emails for testing
  mailhog:
    image: mailhog/mailhog:latest
    container_name: shinwa-dev-mailhog
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    networks:
      - shinwa-dev

volumes:
  postgres-data:
  redis-data:

networks:
  shinwa-dev:
    driver: bridge
