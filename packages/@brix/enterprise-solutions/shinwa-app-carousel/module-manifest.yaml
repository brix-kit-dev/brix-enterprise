# ===========================================================
# shinwa-app-carousel 模块声明文件
# v3.0 Runtime Shell 架构
# 迁移自: plugin-carousel
# ===========================================================

module:
  id: shinwa-app-carousel
  version: 3.0.0-SNAPSHOT
  name: 轮播管理
  vendor: Shinwa Solutions
  description: |
    轮播位和Banner管理模块，支持多端差异化配置。
    提供轮播位管理、Banner管理、统计分析等功能。

# 模块结构
structure:
  api: carousel-api
  core: carousel-core
  server: carousel-server

lifecycle:
  startup-order: 100
  dependencies: []

capabilities:
  required:
    - EventBusCapability       # 用于发布轮播变更事件
    - StateStoreCapability     # 用于缓存轮播配置
    - ObservabilityCapability  # 用于记录监控指标
    - ConfigStoreCapability    # 用于获取轮播配置

  optional:
    - AuthContextCapability    # 用于管理端权限校验

# 事件定义
events:
  publishes:
    - name: BannerClickedEvent
      description: Banner被点击事件
    - name: BannerViewedEvent
      description: Banner被展示事件
    - name: CarouselConfigChangedEvent
      description: 轮播配置变更事件

  subscribes: []

permissions:
  - id: "carousel:read"
    description: 查看轮播
  - id: "carousel:create"
    description: 创建轮播
  - id: "carousel:update"
    description: 更新轮播
  - id: "carousel:delete"
    description: 删除轮播
  - id: "carousel:statistics"
    description: 查看统计

config:
  - key: "carousel.cache-ttl"
    description: 轮播缓存时间（秒）
    default: "300"
  - key: "carousel.max-banners"
    description: 单个轮播位最大Banner数
    default: "10"

# 端口配置
ports:
  server: 8083
  ui-web: 3003
  ui-mobile: 4003

# 数据库表
tables:
  - name: carousel
    description: 轮播位表
  - name: banner
    description: Banner表
  - name: banner_statistics
    description: Banner统计表
