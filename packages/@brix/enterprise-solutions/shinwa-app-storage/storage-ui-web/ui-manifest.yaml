# Storage Module UI Manifest
# Version: 3.0.4
# Architecture: Runtime Shell with Module Federation

module:
  name: storage
  version: 3.0.0-SNAPSHOT
  type: ui-web
  
# Module Federation Configuration
federation:
  name: storage
  filename: remoteEntry.js
  port: 3053

# Route Registration
routes:
  - path: /files
    page: FileList
    title: 文件列表
    icon: folder
    permissions:
      - storage:file:read
      
  - path: /files/upload
    page: FileUpload
    title: 文件上传
    icon: upload
    permissions:
      - storage:file:write
      
  - path: /files/:id
    page: FileDetail
    title: 文件详情
    permissions:
      - storage:file:read

# Navigation Menu Items
navigation:
  - label: 文件中心
    icon: folder
    path: /files
    order: 500
    permissions:
      - storage:file:read

# Capability Requirements
capabilities:
  required:
    - http
    - auth
  optional:
    - notification
    - i18n
