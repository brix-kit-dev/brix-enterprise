# ================================================================
# Case 模块 UI 模块声明
# 
# 声明 UI 模块的路由、菜单、权限等配置
# 由宿主应用读取并动态注册
# 
# @author Shinwa Team
# @date 2026-02-23
# ================================================================

# 模块基本信息
module:
  id: "case-ui"
  version: "3.0.0-SNAPSHOT"
  name: "Case 模块"
  description: "Brix Platform v3.0 业务应用模块 前端模块"

# 远程模块配置（Module Federation）
remote:
  name: "case"
  entry: "http://localhost:3050/remoteEntry.js"

# 路由配置
routes:
  - path: "/case"
    name: "Case 模块列表"
    component: "./List"
    meta:
      title: "Case 模块"
      icon: "list"
      permission: "case:read"
  
  - path: "/case/:id"
    name: "Case 模块详情"
    component: "./Detail"
    meta:
      title: "Case 模块详情"
      hidden: true
      permission: "case:read"

# 菜单配置
menus:
  - id: "case-menu"
    name: "Case 模块"
    icon: "folder"
    path: "/case"
    order: 100
    permission: "case:read"
    children: []

# 权限配置（与后端 module-manifest.yaml 保持一致）
permissions:
  - id: "case:read"
    name: "查看Case 模块"
  - id: "case:write"
    name: "编辑Case 模块"
