# =====================================================
# 合同管理服务配置
# =====================================================
server:
  port: 8087

spring:
  application:
    name: contracts-server

  # =====================================================
  # Data Source Configuration
  # =====================================================
  # SECURITY: All credentials must be provided via environment variables.
  # No default values are allowed to prevent accidental production exposure.
  # =====================================================
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:brix_contracts}}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      pool-name: ContractsHikariPool

  # JPA配置
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: public

  # Jackson配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

# =====================================================
# 日志配置
# =====================================================
logging:
  level:
    root: INFO
    io.brix.enterprise.app.app.contracts: DEBUG
    org.hibernate.SQL: DEBUG

# =====================================================
# Actuator配置
# =====================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
