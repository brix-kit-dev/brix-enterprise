# ══════════════════════════════════════════════════════════════════════════════
# UI Manifest - 产品模块 UI 声明清单
# 
# 【设计原则】遵循 v3.0 Manifest-Driven 架构
# 1. 所有 UI 配置在此声明，插件代码不包含任何注册逻辑
# 2. Host 读取此文件进行统一装配
# 3. 插件只声明，Host 拥有最终决策权
# 
# @version 3.0.0
# @date 2026-01-31
# ══════════════════════════════════════════════════════════════════════════════

# ============================================================================
# 插件基本信息
# ============================================================================
plugin:
  id: "products"
  name: "产品管理"
  version: "3.0.0"
  description: "产品套餐展示与管理"
  vendor: "Shinwa Solutions"
  icon: "Inventory"
  category: "business"

# ============================================================================
# Module Federation 配置
# ============================================================================
federation:
  name: "products"
  filename: "remoteEntry.js"
  exposes:
    "./pages/ProductList": "./src/pages/ProductListPage.tsx"
    "./pages/ProductDetail": "./src/pages/ProductDetailPage.tsx"
    "./pages/ProductCreate": "./src/pages/ProductCreatePage.tsx"
    "./pages/ProductEdit": "./src/pages/ProductEditPage.tsx"
  shared:
    react:
      singleton: true
      requiredVersion: "^18.3.0"
    react-dom:
      singleton: true
      requiredVersion: "^18.3.0"
    "@mui/material":
      singleton: true
      requiredVersion: "^5.16.0"
    "@emotion/react":
      singleton: true
    "@emotion/styled":
      singleton: true

# ============================================================================
# 页面声明（替代路由注册）
# 【关键】插件不注册路由，只声明 PageId，Host 负责映射
# ============================================================================
pages:
  # -------------------- 产品列表 --------------------
  - pageId: "products:list"
    component: "./pages/ProductList"
    title: "产品列表"
    titleKey: "products.page.list.title"
    permission: "products:read"
    platforms:
      web:
        suggestedPath: "/products"
      mobile:
        suggestedScreen: "ProductListScreen"
    config:
      keepAlive: true
      breadcrumb:
        - label: "首页"
          pageId: "home"
        - label: "产品管理"

  # -------------------- 产品详情 --------------------
  - pageId: "products:detail"
    component: "./pages/ProductDetail"
    title: "产品详情"
    titleKey: "products.page.detail.title"
    permission: "products:read"
    params:
      - name: "id"
        type: "string"
        required: true
    platforms:
      web:
        suggestedPath: "/products/:id"
      mobile:
        suggestedScreen: "ProductDetailScreen"
    config:
      breadcrumb:
        - label: "首页"
          pageId: "home"
        - label: "产品管理"
          pageId: "products:list"
        - label: "产品详情"

  # -------------------- 创建产品 --------------------
  - pageId: "products:create"
    component: "./pages/ProductCreate"
    title: "新建产品"
    titleKey: "products.page.create.title"
    permission: "products:write"
    platforms:
      web:
        suggestedPath: "/products/create"
      mobile:
        suggestedScreen: "ProductCreateScreen"
    config:
      breadcrumb:
        - label: "首页"
          pageId: "home"
        - label: "产品管理"
          pageId: "products:list"
        - label: "新建产品"

  # -------------------- 编辑产品 (Phase 5 Week 10) --------------------
  - pageId: "products:edit"
    component: "./pages/ProductEdit"
    title: "编辑产品"
    titleKey: "products.page.edit.title"
    permission: "products:write"
    params:
      - name: "id"
        type: "string"
        required: true
    platforms:
      web:
        suggestedPath: "/products/:id/edit"
      mobile:
        suggestedScreen: "ProductEditScreen"
    config:
      breadcrumb:
        - label: "首页"
          pageId: "home"
        - label: "产品管理"
          pageId: "products:list"
        - label: "编辑产品"

# ============================================================================
# 菜单声明（替代菜单注册）
# ============================================================================
menus:
  - id: "products"
    title: "产品管理"
    icon: "inventory"
    order: 40
    permission: "products:read"
    children:
      - id: "products:list"
        title: "产品列表"
        icon: "list"
        pageId: "products:list"
        order: 1
      - id: "products:create"
        title: "新建产品"
        icon: "add"
        pageId: "products:create"
        order: 2
        permission: "products:write"

# ============================================================================
# 权限声明
# ============================================================================
permissions:
  - code: "products:read"
    name: "查看产品"
    description: "允许查看产品列表和详情"
  - code: "products:write"
    name: "编辑产品"
    description: "允许创建和编辑产品"
  - code: "products:delete"
    name: "删除产品"
    description: "允许删除产品"
  - code: "products:review"
    name: "审核产品"
    description: "允许审核产品上下架"

# ============================================================================
# 依赖配置
# ============================================================================
dependencies:
  api:
    baseUrl: "/api/v1/products"
    version: "v1"

# ============================================================================
# 开发服务器配置
# ============================================================================
devServer:
  port: 3004
