# ══════════════════════════════════════════════════════════════════════════════
# UI Manifest - 合作伙伴管理模块 UI 声明清单
# 
# 【设计原则】遵循 v3.0 Manifest-Driven 架构
# 1. 所有 UI 配置在此声明，插件代码不包含任何注册逻辑
# 2. Host 读取此文件进行统一装配
# 3. 插件只声明，Host 拥有最终决策权
# 
# @version 3.0.0
# @date 2026-01-31
# ══════════════════════════════════════════════════════════════════════════════

# ============================================================================
# 插件基本信息
# ============================================================================
plugin:
  id: "partners"
  name: "合作伙伴管理"
  version: "3.0.0"
  description: "管理医院、酒店、交通、翻译等合作伙伴信息"
  vendor: "Shinwa Solutions"
  icon: "Business"
  category: "business"

# ============================================================================
# Module Federation 配置
# ============================================================================
federation:
  name: "partners"
  filename: "remoteEntry.js"
  exposes:
    "./pages/PartnerList": "./src/pages/PartnerListPage.tsx"
    "./pages/PartnerDetail": "./src/pages/PartnerDetailPage.tsx"
    "./pages/PartnerCreate": "./src/pages/PartnerCreatePage.tsx"
    "./pages/PartnerEdit": "./src/pages/PartnerEditPage.tsx"
  shared:
    react:
      singleton: true
      requiredVersion: "^18.3.0"
    react-dom:
      singleton: true
      requiredVersion: "^18.3.0"
    "@mui/material":
      singleton: true
      requiredVersion: "^5.16.0"
    "@emotion/react":
      singleton: true
    "@emotion/styled":
      singleton: true

# ============================================================================
# 页面声明（替代路由注册）
# 【关键】插件不注册路由，只声明 PageId，Host 负责映射
# ============================================================================
pages:
  # -------------------- 合作伙伴列表 --------------------
  - pageId: "partners:list"
    component: "./pages/PartnerList"
    title: "合作伙伴列表"
    titleKey: "partners.page.list.title"
    permission: "partner:read"
    platforms:
      web:
        suggestedPath: "/partners"
      mobile:
        suggestedScreen: "PartnerListScreen"
    config:
      keepAlive: true
      breadcrumb:
        - label: "首页"
          pageId: "home"
        - label: "合作伙伴管理"

  # -------------------- 合作伙伴详情 --------------------
  - pageId: "partners:detail"
    component: "./pages/PartnerDetail"
    title: "合作伙伴详情"
    titleKey: "partners.page.detail.title"
    permission: "partner:read"
    params:
      - name: "id"
        type: "string"
        required: true
    platforms:
      web:
        suggestedPath: "/partners/:id"
      mobile:
        suggestedScreen: "PartnerDetailScreen"
    config:
      breadcrumb:
        - label: "首页"
          pageId: "home"
        - label: "合作伙伴管理"
          pageId: "partners:list"
        - label: "合作伙伴详情"

  # -------------------- 新建合作伙伴 --------------------
  - pageId: "partners:create"
    component: "./pages/PartnerCreate"
    title: "新建合作伙伴"
    titleKey: "partners.page.create.title"
    permission: "partner:create"
    platforms:
      web:
        suggestedPath: "/partners/create"
      mobile:
        suggestedScreen: "PartnerCreateScreen"
    config:
      breadcrumb:
        - label: "首页"
          pageId: "home"
        - label: "合作伙伴管理"
          pageId: "partners:list"
        - label: "新建合作伙伴"

  # -------------------- 编辑合作伙伴 --------------------
  - pageId: "partners:edit"
    component: "./pages/PartnerEdit"
    title: "编辑合作伙伴"
    titleKey: "partners.page.edit.title"
    permission: "partner:update"
    params:
      - name: "id"
        type: "string"
        required: true
    platforms:
      web:
        suggestedPath: "/partners/:id/edit"
      mobile:
        suggestedScreen: "PartnerEditScreen"
    config:
      breadcrumb:
        - label: "首页"
          pageId: "home"
        - label: "合作伙伴管理"
          pageId: "partners:list"
        - label: "编辑合作伙伴"

# ============================================================================
# 菜单声明（替代菜单注册）
# ============================================================================
menus:
  - id: "partners"
    title: "合作伙伴管理"
    icon: "business"
    order: 50
    permission: "partner:read"
    children:
      - id: "partners:list"
        title: "合作伙伴列表"
        icon: "list"
        pageId: "partners:list"
        order: 1
      - id: "partners:create"
        title: "新建合作伙伴"
        icon: "add"
        pageId: "partners:create"
        order: 2
        permission: "partner:create"

# ============================================================================
# 权限声明
# ============================================================================
permissions:
  - code: "partner:read"
    name: "查看合作伙伴"
    description: "允许查看合作伙伴列表和详情"
  - code: "partner:create"
    name: "创建合作伙伴"
    description: "允许创建新的合作伙伴"
  - code: "partner:update"
    name: "更新合作伙伴"
    description: "允许更新合作伙伴信息"
  - code: "partner:delete"
    name: "删除合作伙伴"
    description: "允许删除合作伙伴"
  - code: "partner:status"
    name: "变更合作伙伴状态"
    description: "允许激活、暂停、终止合作伙伴"

# ============================================================================
# 开发服务器配置
# ============================================================================
devServer:
  port: 3004
  proxy:
    /api: "http://localhost:8084"
