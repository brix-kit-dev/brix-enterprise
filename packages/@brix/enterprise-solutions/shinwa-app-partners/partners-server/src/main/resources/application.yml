# =====================================================
# 合作伙伴管理服务配置
# Shinwa App - Partners
# 端口：8084
# =====================================================

server:
  port: 8084

spring:
  application:
    name: shinwa-partners-server
  
  # 数据源配置
  datasource:
    url: jdbc:postgresql://localhost:5432/shinwa_partners
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
  
  # JPA 配置
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

# 日志配置
logging:
  level:
    com.shinwa.app.partners: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
