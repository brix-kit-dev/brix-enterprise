# ================================================================
# 合同管理模块 UI 模块声明
# 
# 声明 UI 模块的路由、菜单、权限等配置
# 由宿主应用读取并动态注册
# 
# @author Shinwa Team
# @date 2026-02-23
# ================================================================

# 模块基本信息
module:
  id: "contracts-ui"
  version: "3.0.0-SNAPSHOT"
  name: "合同管理"
  description: "合同模板与合同实例管理模块"

# 远程模块配置（Module Federation）
remote:
  name: "contracts"
  entry: "http://localhost:3051/remoteEntry.js"

# 路由配置
routes:
  # 合同模板路由
  - path: "/contracts/templates"
    name: "合同模板列表"
    component: "./pages/ContractTemplateList"
    meta:
      title: "合同模板"
      icon: "file-text"
      permission: "contracts:template:read"
  
  - path: "/contracts/templates/create"
    name: "创建合同模板"
    component: "./pages/ContractTemplateCreate"
    meta:
      title: "创建模板"
      hidden: true
      permission: "contracts:template:write"
  
  - path: "/contracts/templates/:id"
    name: "合同模板详情"
    component: "./pages/ContractTemplateDetail"
    meta:
      title: "模板详情"
      hidden: true
      permission: "contracts:template:read"

  # 合同实例路由
  - path: "/contracts"
    name: "合同列表"
    component: "./pages/ContractList"
    meta:
      title: "合同管理"
      icon: "file-signature"
      permission: "contracts:read"
  
  - path: "/contracts/create"
    name: "创建合同"
    component: "./pages/ContractCreate"
    meta:
      title: "创建合同"
      hidden: true
      permission: "contracts:write"
  
  - path: "/contracts/:id"
    name: "合同详情"
    component: "./pages/ContractDetail"
    meta:
      title: "合同详情"
      hidden: true
      permission: "contracts:read"

# 菜单配置
menus:
  - id: "contracts-menu"
    name: "合同管理"
    icon: "file-contract"
    path: "/contracts"
    order: 200
    permission: "contracts:read"
    children:
      - id: "contracts-list"
        name: "合同列表"
        path: "/contracts"
        icon: "list"
        order: 1
        permission: "contracts:read"
      - id: "contracts-templates"
        name: "合同模板"
        path: "/contracts/templates"
        icon: "file-text"
        order: 2
        permission: "contracts:template:read"

# 权限配置（与后端 module-manifest.yaml 保持一致）
permissions:
  - id: "contracts:read"
    name: "查看合同"
  - id: "contracts:write"
    name: "编辑合同"
  - id: "contracts:delete"
    name: "删除合同"
  - id: "contracts:template:read"
    name: "查看合同模板"
  - id: "contracts:template:write"
    name: "编辑合同模板"
  - id: "contracts:template:delete"
    name: "删除合同模板"
