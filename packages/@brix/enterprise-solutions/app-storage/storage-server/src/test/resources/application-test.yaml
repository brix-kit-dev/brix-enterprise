# ============================================================================
# Storage Module Test Configuration
# ============================================================================
# Integration test configuration for Storage module E2E tests.
# Uses H2 in-memory database and temporary file system for test isolation.
#
# Author: Brix Team
# Version: 3.0.0-SNAPSHOT
# Date: 2026-02-24
# ============================================================================

spring:
  application:
    name: storage-test

  # ----- Database Configuration -----
  datasource:
    url: jdbc:h2:mem:storage_test_db;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # ----- JPA Configuration -----
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  # ----- H2 Console -----
  h2:
    console:
      enabled: true
      path: /h2-console

  # ----- File Upload Configuration -----
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

# ============================================================================
# Storage Configuration
# ============================================================================
storage:
  # Use temporary directory for test files
  base-path: ${java.io.tmpdir}/brix-storage-test
  
  # Allowed file types
  allowed-extensions:
    - pdf
    - jpg
    - jpeg
    - png
    - doc
    - docx
    - xls
    - xlsx
  
  # Max file size (10MB for tests)
  max-file-size: 10485760

# ============================================================================
# Runtime Context Mock Configuration
# ============================================================================
runtime:
  context:
    tenant-id: test-tenant
    auth:
      enabled: false
      mock-user-id: test-user
    eventbus:
      type: in-memory
    observability:
      metrics-enabled: false
      tracing-enabled: false

# ============================================================================
# Logging Configuration
# ============================================================================
logging:
  level:
    root: WARN
    io.brix.enterprise.app.app.storage: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG

# ============================================================================
# Server Configuration
# ============================================================================
server:
  port: 0
