# ============================================================================
# Intake Application Configuration
# Copyright 2026 Brix Enterprise Team
# ============================================================================

spring:
  application:
    name: intake-app

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        jdbc:
          time_zone: UTC

  # H2 Database (Development)
  datasource:
    url: jdbc:h2:mem:intakedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # H2 Console (Development only)
  h2:
    console:
      enabled: true
      path: /h2-console

# Server Configuration
server:
  port: 8086
  servlet:
    context-path: /intake

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

# OpenAPI Documentation
springdoc:
  api-docs:
    path: /api-docs
    # springdoc 3 defaults to OpenAPI 3.1; keep the OpenAPI 3.0 document
    version: openapi_3_0
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

# Logging Configuration
logging:
  level:
    root: INFO
    io.brix.enterprise.app.app.intake: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

---
# ============================================================================
# Production Profile
# ============================================================================
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:intakedb}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:intake}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  h2:
    console:
      enabled: false

logging:
  level:
    root: WARN
    io.brix.enterprise.app.app.intake: INFO
    org.springframework: WARN
    org.hibernate: WARN
