# UI Manifest for Tenant Management Plugin
# Aligned with v3.0.10 Runtime Shell UI manifest boundaries

plugin:
  id: brix-app-tenant
  name: 租户管理
  version: 3.2.0-SNAPSHOT
  description: Platform-level tenant management module

platforms:
  web:
    enabled: true
  mobile:
    enabled: false  # Admin interface not needed on mobile

# ═════════════════════════════════════════════════════════════════
# Menu Definitions
# ═════════════════════════════════════════════════════════════════
menus:
  - id: platform-admin
    title:
      zh-CN: 平台管理
      en-US: Platform Admin
      ja-JP: プラットフォーム管理
    icon: admin_panel_settings
    order: 900
    permission: tenant:admin:read
    children:
      - id: tenant:list
        title:
          zh-CN: 租户列表
          en-US: Tenant List
          ja-JP: テナント一覧
        pageId: tenant:list
        icon: business
        order: 1
        permission: tenant:admin:read
      
      - id: tenant:create
        title:
          zh-CN: 创建租户
          en-US: Create Tenant
          ja-JP: テナント作成
        pageId: tenant:create
        icon: add_business
        order: 2
        permission: tenant:admin:create

# ═════════════════════════════════════════════════════════════════
# Page Definitions
# ═════════════════════════════════════════════════════════════════
pages:
  - pageId: tenant:list
    title:
      zh-CN: 租户列表
      en-US: Tenant List
    component: ./pages/TenantList
    platforms:
      web:
        suggestedPath: /admin/tenants
    permission: tenant:admin:read

  - pageId: tenant:detail
    title:
      zh-CN: 租户详情
      en-US: Tenant Detail
    component: ./pages/TenantDetail
    platforms:
      web:
        suggestedPath: /admin/tenants/:tenantId
    permission: tenant:admin:read

  - pageId: tenant:create
    title:
      zh-CN: 创建租户
      en-US: Create Tenant
    component: ./pages/TenantCreate
    platforms:
      web:
        suggestedPath: /admin/tenants/create
    permission: tenant:admin:create

  - pageId: tenant:members
    title:
      zh-CN: 成员管理
      en-US: Member Management
    component: ./pages/TenantMembers
    platforms:
      web:
        suggestedPath: /admin/tenants/:tenantId/members
    permission: tenant:admin:read

# ═════════════════════════════════════════════════════════════════
# Capability Dependencies
# ═════════════════════════════════════════════════════════════════
capabilities:
  required:
    - http
    - auth
    - navigation
    - eventBus
  optional:
    - theme
    - i18n
    - notification
