# ══════════════════════════════════════════════════════════════════════════════
# UI Manifest - 身份认证模块 Mobile UI 声明清单
# 
# 【设计原则】遵循 v3.0 Manifest-Driven 架构
# 1. 所有 UI 配置在此声明，插件代码不包含任何注册逻辑
# 2. Host 读取此文件进行统一装配
# 3. 插件只声明，Host 拥有最终决策权
# 
# @version 3.0.0
# @date 2026-01-31
# ══════════════════════════════════════════════════════════════════════════════

# ============================================================================
# 插件基本信息
# ============================================================================
plugin:
  id: "identity"
  name: "身份认证"
  version: "3.0.0"
  description: "身份认证模块 React Native 移动端界面"
  vendor: "Brix Platform"
  platform: "mobile"

# ============================================================================
# 导出配置
# ============================================================================
exports:
  # 导航器
  navigation: "./src/navigation"
  # 屏幕组件
  screens:
    - name: "UserListScreen"
      path: "./src/screens/UserListScreen"
    - name: "UserDetailScreen"
      path: "./src/screens/UserDetailScreen"
    - name: "UserCreateScreen"
      path: "./src/screens/UserCreateScreen"

# ============================================================================
# 页面声明（替代路由注册）
# 【关键】使用 PageId 而非 screen name，与 Web 统一
# ============================================================================
pages:
  # -------------------- 用户列表 --------------------
  - pageId: "identity:user-list"
    component: "./screens/UserListScreen"
    title: "用户管理"
    titleKey: "identity.page.userList.title"
    icon: "account-group"
    permission: "user:read"

  # -------------------- 用户详情 --------------------
  - pageId: "identity:user-detail"
    component: "./screens/UserDetailScreen"
    title: "用户详情"
    titleKey: "identity.page.userDetail.title"
    permission: "user:read"
    params:
      - name: "userId"
        type: "string"
        required: true

  # -------------------- 创建/编辑用户 --------------------
  - pageId: "identity:user-create"
    component: "./screens/UserCreateScreen"
    title: "创建用户"
    titleKey: "identity.page.userCreate.title"
    permission: "user:create"
    params:
      - name: "userId"
        type: "string"
        required: false

# ============================================================================
# 权限声明
# ============================================================================
permissions:
  - code: "user:read"
    name: "查看用户"
    description: "允许查看用户列表和详情"
  - code: "user:create"
    name: "创建用户"
    description: "允许创建新用户"
  - code: "user:update"
    name: "更新用户"
    description: "允许更新用户信息"
  - code: "user:delete"
    name: "删除用户"
    description: "允许删除用户"
  - code: "user:status"
    name: "管理用户状态"
    description: "允许启用/禁用/锁定/解锁用户"
