# ══════════════════════════════════════════════════════════════════════════════
# UI Manifest - 预约模块 UI 声明清单
# 
# 【设计原则】遵循 v3.0 Manifest-Driven 架构
# 1. 所有 UI 配置在此声明，插件代码不包含任何注册逻辑
# 2. Host 读取此文件进行统一装配
# 3. 插件只声明，Host 拥有最终决策权
# 
# 【与代码的关系】
# - pages[].component 对应 rspack.config.ts 中的 exposes
# - events.published 对应 booking-shared/events 中的事件类型
# - permissions 对应 booking-shared/constants 中的权限代码
# 
# @version 3.0.0
# @date 2026-01-30
# ══════════════════════════════════════════════════════════════════════════════

# ============================================================================
# 插件基本信息
# ============================================================================
plugin:
  id: "booking"
  name: "预约管理"
  version: "3.0.0-SNAPSHOT"
  description: "Brix Enterprise 预约管理业务插件，提供资源预约的完整业务能力"
  vendor: "Brix Platform"

# ============================================================================
# 页面声明（替代路由注册）
# 【关键】插件不注册路由，只声明 PageId，Host 负责映射
# ============================================================================
pages:
  # -------------------- 预约列表 --------------------
  - pageId: "booking:list"
    component: "./pages/BookingList"
    title: "预约列表"
    titleKey: "booking.page.list.title"
    permission: "booking:read"
    # 多端映射（仅建议，Host 可覆盖）
    platforms:
      web:
        suggestedPath: "/booking"
      mobile:
        suggestedScreen: "BookingListScreen"
    # 页面配置
    config:
      # 是否支持缓存
      keepAlive: true
      # 面包屑配置
      breadcrumb:
        - label: "首页"
          pageId: "home"
        - label: "预约管理"

  # -------------------- 预约详情 --------------------
  - pageId: "booking:detail"
    component: "./pages/BookingDetail"
    title: "预约详情"
    titleKey: "booking.page.detail.title"
    permission: "booking:read"
    # 页面参数
    params:
      - name: "id"
        type: "string"
        required: true
        description: "预约 ID"
    platforms:
      web:
        suggestedPath: "/booking/:id"
      mobile:
        suggestedScreen: "BookingDetailScreen"
    config:
      breadcrumb:
        - label: "首页"
          pageId: "home"
        - label: "预约列表"
          pageId: "booking:list"
        - label: "预约详情"

  # -------------------- 创建预约 --------------------
  - pageId: "booking:create"
    component: "./pages/BookingCreate"
    title: "创建预约"
    titleKey: "booking.page.create.title"
    permission: "booking:create"
    platforms:
      web:
        suggestedPath: "/booking/create"
      mobile:
        suggestedScreen: "BookingCreateScreen"
    config:
      breadcrumb:
        - label: "首页"
          pageId: "home"
        - label: "预约列表"
          pageId: "booking:list"
        - label: "创建预约"

  # -------------------- 日历视图 --------------------
  - pageId: "booking:calendar"
    component: "./pages/BookingCalendar"
    title: "日历视图"
    titleKey: "booking.page.calendar.title"
    permission: "booking:read"
    platforms:
      web:
        suggestedPath: "/booking/calendar"
      mobile:
        suggestedScreen: "BookingCalendarScreen"
    config:
      keepAlive: true
      breadcrumb:
        - label: "首页"
          pageId: "home"
        - label: "预约管理"

  # -------------------- 资源管理 --------------------
  - pageId: "booking:resource-management"
    component: "./pages/ResourceManagement"
    title: "资源管理"
    titleKey: "booking.page.resource.title"
    permission: "booking:manage_resource"
    platforms:
      web:
        suggestedPath: "/booking/resources"
      mobile:
        suggestedScreen: "ResourceManagementScreen"
    config:
      breadcrumb:
        - label: "首页"
          pageId: "home"
        - label: "预约管理"
        - label: "资源管理"

# ============================================================================
# 菜单声明（替代菜单注册）
# 【关键】关联 PageId 而非 path
# ============================================================================
menus:
  - id: "booking"
    title: "预约管理"
    icon: "calendar"
    order: 100
    permission: "booking:read"
    children:
      # 预约列表
      - id: "booking:list"
        title: "预约列表"
        pageId: "booking:list"
        icon: "list"
        order: 1
      # 日历视图
      - id: "booking:calendar"
        title: "日历视图"
        pageId: "booking:calendar"
        icon: "calendar_month"
        order: 2
      # 创建预约
      - id: "booking:create"
        title: "创建预约"
        pageId: "booking:create"
        icon: "add"
        order: 3
        permission: "booking:create"
      # 资源管理
      - id: "booking:resource"
        title: "资源管理"
        pageId: "booking:resource-management"
        icon: "inventory"
        order: 4
        permission: "booking:manage_resource"

# ============================================================================
# 事件声明（替代运行时事件发布）
# 【关键】所有事件在此声明，Runtime Shell 负责路由
# ============================================================================
events:
  # -------------------- 本插件发布的事件 --------------------
  published:
    # 预约创建成功
    - type: "booking:created"
      description: "预约创建成功后发布"
      payload:
        type: "object"
        properties:
          id: { type: "number", description: "预约 ID" }
          bookingNo: { type: "string", description: "预约编号" }
          customerId: { type: "string", description: "客户 ID" }
          resourceId: { type: "number", description: "资源 ID" }
          resourceName: { type: "string", description: "资源名称" }
          date: { type: "string", format: "date", description: "预约日期" }
          startTime: { type: "string", description: "开始时间" }
          endTime: { type: "string", description: "结束时间" }
      scope: "global"

    # 预约已确认
    - type: "booking:confirmed"
      description: "预约被确认后发布"
      payload:
        type: "object"
        properties:
          id: { type: "number" }
          bookingNo: { type: "string" }
          confirmedAt: { type: "string", format: "date-time" }
          confirmedBy: { type: "string" }
      scope: "global"

    # 预约已取消
    - type: "booking:cancelled"
      description: "预约被取消后发布"
      payload:
        type: "object"
        properties:
          id: { type: "number" }
          bookingNo: { type: "string" }
          reason: { type: "string" }
          cancelledAt: { type: "string", format: "date-time" }
          cancelledBy: { type: "string" }
      scope: "global"

    # 预约已完成
    - type: "booking:completed"
      description: "预约服务完成后发布"
      payload:
        type: "object"
        properties:
          id: { type: "number" }
          bookingNo: { type: "string" }
          completedAt: { type: "string", format: "date-time" }
      scope: "global"

    # 预约爽约
    - type: "booking:no_show"
      description: "客户未按时到达"
      payload:
        type: "object"
        properties:
          id: { type: "number" }
          bookingNo: { type: "string" }
          markedAt: { type: "string", format: "date-time" }
      scope: "global"

  # -------------------- 本插件订阅的事件 --------------------
  subscribed:
    # 用户选择事件（来自 identity 插件）
    - type: "user:selected"
      description: "用户选择事件，用于筛选指定用户的预约"
      source: "identity"

# ============================================================================
# 权限声明
# ============================================================================
permissions:
  - id: "booking:read"
    name: "查看预约"
    nameKey: "permission.booking.read"
    description: "允许查看预约列表和详情"

  - id: "booking:create"
    name: "创建预约"
    nameKey: "permission.booking.create"
    description: "允许创建新预约"

  - id: "booking:write"
    name: "编辑预约"
    nameKey: "permission.booking.write"
    description: "允许修改预约信息"

  - id: "booking:delete"
    name: "删除预约"
    nameKey: "permission.booking.delete"
    description: "允许删除预约"

  - id: "booking:confirm"
    name: "确认预约"
    nameKey: "permission.booking.confirm"
    description: "允许确认预约"

  - id: "booking:cancel"
    name: "取消预约"
    nameKey: "permission.booking.cancel"
    description: "允许取消预约"

  - id: "booking:complete"
    name: "完成预约"
    nameKey: "permission.booking.complete"
    description: "允许标记预约完成"

  - id: "booking:manage_resource"
    name: "管理资源"
    nameKey: "permission.booking.manageResource"
    description: "允许管理可预约资源"

# ============================================================================
# 能力依赖声明
# ============================================================================
capabilities:
  # 必需能力（缺失则插件无法运行）
  required:
    - navigation       # 导航能力（基于 PageId）
    - menu             # 菜单能力
    - auth             # 认证能力（权限检查）
    - event-bus        # 事件总线能力
    - plugin-state     # 插件状态能力
  # 可选能力（缺失则降级运行）
  optional:
    - i18n             # 国际化能力
    - theme            # 主题能力
    - layout           # 布局能力
    - observability    # 可观测性能力

# ============================================================================
# 开发配置
# ============================================================================
devServer:
  port: 3015
  host: "localhost"
